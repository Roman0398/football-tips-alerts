
name: Test Telegram Notification

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram test
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse

          token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]

          message = (
              "🔔 ТЕСТ СПОВІЩЕННЯ\n\n"
              "✅ Geobetting Alerts підключений!\n"
              "⚽ Футбольні прогнози\n"
              "🇺🇦 Повідомлення українською\n\n"
              "Це тест, а не реальна ставка."
          )

          url = (
              f"https://api.telegram.org/"
              f"bot{token}/sendMessage"
          )

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message,
              "disable_notification": "false"
          }).encode("utf-8")

          with urllib.request.urlopen(
              url, data=data, timeout=30
          ) as response:
              result = json.load(response)

          if not result.get("ok"):
              raise RuntimeError(
                  "Telegram notification failed"
              )

          print("Telegram test delivered successfully!")
          PY
