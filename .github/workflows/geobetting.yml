
name: Football Tips Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: football-tips
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies
        run: |
          pip install beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Monitor and Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python3 -u - <<'PY'
          import hashlib, json, os, re, subprocess, unicodedata
          import urllib.parse, urllib.request
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          KYIV, LONDON = ZoneInfo('Europe/Kyiv'), ZoneInfo('Europe/London')
          STATE = Path('.state/football-tips.json')
          SOURCES = {
              'Geobetting': 'https://www.olbg.com/tipsters/tips/420769',
              'tipstonga': 'https://www.olbg.com/best-tipsters/Football/1/13000'
          }
          MARKETS = {'Result':'Результат матчу','Full Time Result':'Результат матчу',
                     'Both Teams to Score':'Обидві заб’ють','Total Goals':'Тотал голів',
                     'Asian Hcap':'Азійська фора','Correct Score':'Точний рахунок',
                     'Result and BTTS':'Результат + ОЗ','Total Corners':'Кутові',
                     'Total Cards':'Картки','Half Time Result':'Перший тайм',
                     'Half Time/Full Time':'Тайм / матч','Anytime Goalscorer':'Автор гола',
                     'First Goalscorer':'Перший гол'}
          FIXTURE = re.compile(r'^(?:(\d{1,2}:\d{2})\s+)?(.+?)\s+v\s+(.+)$',re.I)
          DATE = re.compile(r'^\d{1,2} [A-Za-z]+ 20\d{2}$')
          TOKEN, CHAT = os.environ['BOT_TOKEN'].strip(), os.environ['CHAT_ID'].strip()
          state = json.loads(STATE.read_text()) if STATE.exists() else {}
          seen = set(state.get('seen',[]))
          snaps = state.setdefault('snapshots',{})
          matches = state.setdefault('matches',{})

          def now():
              return datetime.now(KYIV)

          def request(url, payload=None):
              raw = urllib.parse.urlencode(payload).encode() if payload is not None else None
              req = urllib.request.Request(url,data=raw,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=22) as resp:
                  return json.load(resp)

          def api(method,args=None):
              data = request('https://api.telegram.org/bot'+TOKEN+'/'+method,args or {})
              if not data.get('ok'):
                  raise RuntimeError('Telegram '+method+' failed: '+str(data.get('description','')))
              return data['result']

          MENU = [
              [('📊 Цей місяць','stats'),('🏆 Разом','total')],
              [('📈 30 днів','compare'),('📚 Архів','archive')],
              [('📅 3 місяці','last3'),('📅 6 місяців','last6')],
              [('📅 12 місяців','last12'),('♾ Весь час','alltime')],
              [('⏳ Очікують','pending'),('🔎 Джерела','sources')],
              [('❔ Допомога','help')]]
          BACK = [[('⬅️ Головне меню','menu')]]

          def send(text,buttons=None,edit=None):
              args={'chat_id':CHAT,'text':text[:4096],'disable_web_page_preview':'true'}
              if buttons is not None:
                  args['reply_markup']=json.dumps({'inline_keyboard':[
                      [{'text':label,'callback_data':key} for label,key in line]
                      for line in buttons]},ensure_ascii=False)
              if edit is not None:
                  args['message_id']=edit
                  return api('editMessageText',args)
              return api('sendMessage',args)

          def save():
              state['seen']=sorted(seen)
              STATE.parent.mkdir(parents=True,exist_ok=True)
              STATE.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n')
              subprocess.run(['git','add',str(STATE)],check=True)
              if subprocess.run(['git','diff','--cached','--quiet']).returncode==0:
                  return
              subprocess.run(['git','-c','user.name=github-actions[bot]',
                  '-c','user.email=41898282+github-actions[bot]@users.noreply.github.com',
                  'commit','-m','Update football tip archive'],check=True)
              for attempt in range(3):
                  result=subprocess.run(['git','push','origin','HEAD:main'],capture_output=True,text=True)
                  if result.returncode==0:
                      return
                  if attempt==2:
                      raise RuntimeError('git push: '+result.stderr[-500:])
                  subprocess.run(['git','fetch','origin','main'],check=True)
                  subprocess.run(['git','rebase','origin/main'],check=True)

          ALIASES={'roma':'as roma','barca':'barcelona','man utd':'manchester united',
                   'man city':'manchester city','spurs':'tottenham hotspur',
                   'psg':'paris saint germain','como 1907':'como','torino fc':'torino'}

          def norm(s):
              s=''.join(c for c in unicodedata.normalize('NFKD',str(s).lower()) if not unicodedata.combining(c))
              s=re.sub('[^a-z0-9]+',' ',s).strip()
              return ALIASES.get(s,s)

          def make_tip(author,day,clock,home,away,market,selection):
              fixture=day+'|'+'|'.join(sorted([norm(home),norm(away)]))
              raw='|'.join([author,fixture,market,selection.casefold().strip()])
              return dict(id=hashlib.sha256(raw.encode()).hexdigest(),author=author,date=day,
                  time=clock,home=home,away=away,market=market,selection=selection,
                  match_key=fixture,odds=None,url=SOURCES[author])

          def parse_geobetting(body):
              lines=[x.strip() for x in body.splitlines() if x.strip()]
              heading=next((i for i,x in enumerate(lines) if "geobetting's tips" in x.casefold()),None)
              if heading is None:
                  raise ValueError('Geobetting heading missing')
              if 'geobetting has no current tips' in body.casefold():
                  return []
              lines=lines[heading+1:]
              stop=next((i for i,x in enumerate(lines) if 'tips are normally settled' in x.casefold()),len(lines))
              lines=lines[:stop]
              day=clock=home=away=None
              found=[]
              for i,line in enumerate(lines):
                  if DATE.fullmatch(line):
                      day=datetime.strptime(line,'%d %B %Y').date().isoformat()
                      clock=home=away=None
                  elif day and FIXTURE.fullmatch(line):
                      clock,home,away=FIXTURE.fullmatch(line).groups()
                  elif line in MARKETS and day and home and i:
                      choice=lines[i-1]
                      if choice not in MARKETS and not FIXTURE.fullmatch(choice) and len(choice)<100:
                          found.append(make_tip('Geobetting',day,clock,home,away,line,choice))
              if not found:
                  raise ValueError('Geobetting page neither empty nor parsed')
              return list({t['id']:t for t in found}.values())

          def parse_tipstonga(body):
              lines=[x.strip() for x in body.splitlines() if x.strip()]
              marker=next((i for i,x in enumerate(lines) if x.casefold()=='today tips'),None)
              if marker is None:
                  raise ValueError('OLBG did not return Today Tips')
              lines=lines[marker+1:]
              stop=next((i for i,x in enumerate(lines) if 'Profits calculated to a' in x),len(lines))
              lines=lines[:stop]
              today=datetime.now(LONDON).date()
              found=[]; candidates=0
              for i,line in enumerate(lines):
                  match=FIXTURE.fullmatch(line)
                  if not match or not i:
                      continue
                  candidates+=1
                  clock,home,away=match.groups()
                  choice=lines[i-1].lstrip('•').strip()
                  following=lines[i+1:i+12]
                  market=next((x for x in following if x in MARKETS),None)
                  day=None
                  for j,x in enumerate(following):
                      m=re.match(r'^(Today|Tomorrow)(?:\s+(\d{1,2}:\d{2}))?$',x,re.I)
                      if m:
                          day=(today+timedelta(days=(m[1].lower()=='tomorrow'))).isoformat()
                          clock=m[2] or clock
                          if j+1<len(following) and re.fullmatch(r'\d{1,2}:\d{2}',following[j+1]):
                              clock=following[j+1]
                          break
                      if DATE.fullmatch(x):
                          day=datetime.strptime(x,'%d %B %Y').date().isoformat()
                          break
                  if market and day and choice and choice not in MARKETS:
                      found.append(make_tip('tipstonga',day,clock,home,away,market,choice))
              unique={t['id']:t for t in found}
              if candidates!=len(unique):
                  raise ValueError(f'tipstonga partial parsing: {len(unique)}/{candidates}')
              if not candidates and not re.search(r'(no current tips|no tips available|no tips today)',body,re.I):
                  raise ValueError('Today Tips appeared without verifiable fixtures')
              return list(unique.values())

          def odds_from_html(html,tips):
              soup=BeautifulSoup(html,'html.parser')
              nodes=soup.select('span.ui-odds[data-decimal]')
              for t in tips:
                  values=set()
                  for node in nodes:
                      value=node.get('data-decimal','')
                      if not re.fullmatch(r'\d+(?:\.\d+)?',value):
                          continue
                      for parent in node.parents:
                          if parent.name in ('body','html','[document]'):
                              break
                          context=' '.join(parent.stripped_strings)
                          if len(context)>3500:
                              break
                          if (t['home']+' v '+t['away']).casefold() in context.casefold():
                              if (t['selection'].casefold() in context.casefold()
                                  and t['market'].casefold() in context.casefold()
                                  and len(parent.select('span.ui-odds[data-decimal]'))==1):
                                  values.add(value)
                              break
                  if len(values)==1:
                      t['odds']=next(iter(values))

          def fetch_page(browser,author,url):
              for attempt in range(2):
                  page=browser.new_page(locale='en-GB',viewport={'width':1366,'height':900})
                  observed=[]
                  def onresponse(resp):
                      if ('olbg.com' in resp.url and any(x in resp.url.lower() for x in ['tip','api','ajax','graphql'])):
                          observed.append((resp.status,resp.url.split('?')[0][:160]))
                  page.on('response',onresponse)
                  try:
                      resp=page.goto(url,wait_until='domcontentloaded',timeout=35000)
                      if resp and resp.status>=400:
                          raise RuntimeError('HTTP '+str(resp.status))
                      for label in ['Accept all','Allow all','I agree']:
                          try:
                              page.get_by_text(label,exact=True).first.click(timeout=700)
                              break
                          except Exception:
                              pass
                      page.wait_for_timeout(5000)
                      body=page.locator('body').inner_text(timeout=10000)
                      html=page.content()
                      ok=("geobetting's tips" in body.casefold() if author=='Geobetting'
                          else 'today tips' in body.casefold())
                      print('BROWSER',author,'attempt',attempt+1,'chars',len(body),'valid',ok)
                      if ok:
                          return body,html,'browser'
                      print('DIAGNOSTIC',author,'response endpoints',list(dict.fromkeys(observed))[:12])
                      print('DIAGNOSTIC',author,'body excerpt',repr(body[:350]))
                  except Exception as exc:
                      print('BROWSER ERROR',author,type(exc).__name__,str(exc)[:180])
                  finally:
                      page.close()
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'en-GB,en;q=0.9'})
                  with urllib.request.urlopen(req,timeout=20) as resp:
                      html=resp.read(2_000_000).decode('utf-8','replace')
                  soup=BeautifulSoup(html,'html.parser')
                  for node in soup(['script','style','noscript']):
                      node.decompose()
                  body=soup.get_text('\n',strip=True)
                  ok=("geobetting's tips" in body.casefold() if author=='Geobetting'
                      else 'today tips' in body.casefold())
                  print('HTTP',author,'chars',len(body),'valid',ok)
                  if ok:
                      return body,html,'http'
              except Exception as exc:
                  print('HTTP ERROR',author,str(exc)[:160])
              return None,None,None

          def first_seen(item):
              try:
                  dt=datetime.fromisoformat(item['first_seen_at'])
                  return dt.replace(tzinfo=KYIV) if dt.tzinfo is None else dt.astimezone(KYIV)
              except (TypeError,KeyError,ValueError):
                  return None

          def entries(start=None,end=None,author=None):
              return [(k,v) for k,v in snaps.items() if first_seen(v) is not None
                  and (start is None or first_seen(v)>=start)
                  and (end is None or first_seen(v)<end)
                  and (author is None or v.get('author')==author)]

          def month_start(dt):
              return datetime(dt.year,dt.month,1,tzinfo=KYIV)

          def shift(dt,n):
              i=dt.year*12+dt.month-1+n
              return datetime(i//12,i%12+1,1,tzinfo=KYIV)

          RESULTS=('win','loss','push','half_win','half_loss')

          def fmt(n,d=2):
              return f'{n:+.{d}f}'.replace('.',',')

          def summary(rows,label):
              items=[v for _,v in rows]
              counts={r:sum(v.get('result')==r for v in items) for r in RESULTS}
              settled=[v for v in items if v.get('result') in RESULTS]
              pending=len(items)-len(settled)
              n=counts['win']+counts['loss']
              hit=(f'{100*counts["win"]/n:.1f}%'.replace('.',',') if n else 'н/д')
              known=sum(v.get('odds_first_seen') is not None for v in items)
              valued=[v for v in settled if v.get('odds_first_seen') is not None]
              profit=0
              for v in valued:
                  r=v['result']; odds=float(v['odds_first_seen'])
                  profit+= {'win':odds-1,'loss':-1,'push':0,
                      'half_win':(odds-1)/2,'half_loss':-0.5}[r]
              performance=(fmt(profit)+' од. | ROI '+fmt(100*profit/len(valued),1)+'%'
                  if valued else 'н/д | ROI н/д')
              if len(valued)!=len(settled):
                  performance+=' (лише ставки з коеф.)'
              return (f'👤 {label}\n⚽ Прогнозів: {len(items)}\n'
                  f'✅ {counts["win"]}  ❌ {counts["loss"]}  ↩️ {counts["push"]}  ⏳ {pending}\n'
                  f'◐ Піввиграш: {counts["half_win"]}  Півпрограш: {counts["half_loss"]}\n'
                  f'🎯 Прохідність: {hit}\n💰 Прибуток: {performance}\n'
                  f'🔎 Коефіцієнти: {known}/{len(items)}')

          def report(start,end,label,combined=False):
              prefix='📊 FOOTBALL TIPS — '+label+'\n━━━━━━━━━━━━━\n\n'
              if combined:
                  return prefix+summary(entries(start,end),'Обидва разом')
              return (prefix+summary(entries(start,end,'Geobetting'),'Geobetting')+'\n\n'
                  +summary(entries(start,end,'tipstonga'),'tipstonga')+'\n\n'
                  +summary(entries(start,end),'🏆 ОБИДВА РАЗОМ')
                  +'\n\nℹ️ Лише виявлені ботом ставки. ROI за 1 одиницю на ставку з коефіцієнтом.')

          def view(key):
              dt=now(); start=month_start(dt)
              if key in ('menu','start'):
                  return '⚽ FOOTBALL TIPS ALERTS\n\nОбери розділ:',MENU
              if key=='stats':
                  return report(start,shift(start,1),dt.strftime('%m.%Y')),BACK
              if key=='total':
                  return report(start,shift(start,1),dt.strftime('%m.%Y'),True),BACK
              if key=='compare':
                  return report(dt-timedelta(days=30),dt,'30 ДНІВ'),BACK
              if key in ('last3','last6','last12'):
                  n=int(key[4:])
                  return report(shift(start,1-n),dt,f'{n} МІСЯЦІВ'),BACK
              if key=='alltime':
                  return report(None,None,'ЗА ВЕСЬ ЧАС'),BACK
              if key=='help':
                  return ('❔ Прогнози з OLBG. Результати автоматично звіряються лише для підтримуваних ринків і підтверджених матчів. '
                      'Невідомі залишаються в очікуванні.\n/month 2026-10 — статистика місяця.\n'
                      'Кнопки обробляються під час наступного запуску GitHub Actions.'),BACK
              if key=='sources':
                  lines=['🔎 СТАН ДЖЕРЕЛ']
                  for name in SOURCES:
                      s=state.get('source_status',{}).get(name,{})
                      lines.append(f'\n{name}: {s.get("status","ще не перевірено")}\nОстання перевірка: {s.get("checked_at","н/д")}')
                  return '\n'.join(lines),BACK
              if key=='pending':
                  items=sorted([(k,v) for k,v in entries() if v.get('result') not in RESULTS],
                               key=lambda kv:first_seen(kv[1]),reverse=True)
                  lines=[f'⏳ ОЧІКУЮТЬ: {len(items)}']
                  for _,v in items[:12]:
                      lines.append(f'\n⚽ {v.get("fixture")}\n👤 {v.get("author")}\n🎯 {v.get("selection")}')
                  return '\n'.join(lines),BACK
              periods=sorted({d.strftime('%Y-%m') for v in snaps.values() if (d:=first_seen(v))},reverse=True)
              if key in ('archive','history'):
                  return ('📚 АРХІВ\n'+'\n'.join(periods[:24]) if periods else '📚 Архів порожній.'),\
                      [[('📅 '+p,'m:'+p)] for p in periods[:24]]+BACK
              if re.fullmatch(r'm:20\d\d-(?:0[1-9]|1[0-2])',key):
                  year,month=map(int,key[2:].split('-'))
                  s=datetime(year,month,1,tzinfo=KYIV)
                  return report(s,shift(s,1),key[2:]),[[('⬅️ Архів','archive')]]
              return 'Невідома команда. /menu',BACK

          def telegram_updates():
              updates=api('getUpdates',{'offset':int(state.get('telegram_update_id',0)),
                  'limit':100,'timeout':0})
              for update in updates:
                  callback=update.get('callback_query')
                  message=(callback.get('message') or {}) if callback else (update.get('message') or {})
                  if str((message.get('chat') or {}).get('id'))!=CHAT:
                      state['telegram_update_id']=update['update_id']+1
                      continue
                  try:
                      if callback:
                          try:
                              api('answerCallbackQuery',{'callback_query_id':callback['id']})
                          except Exception:
                              pass
                          key=callback.get('data','menu')
                          text,buttons=view(key)
                          try:
                              send(text,buttons,edit=message['message_id'])
                          except Exception:
                              send(text,buttons)
                      else:
                          text=(message.get('text') or '').strip()
                          if text.startswith('/'):
                              words=text.split()
                              key=words[0].split('@')[0].lstrip('/').lower()
                              if key=='month' and len(words)==2:
                                  key='m:'+words[1]
                              msg,buttons=view(key)
                              send(msg,buttons)
                  except Exception as exc:
                      print('TELEGRAM ERROR',type(exc).__name__,str(exc)[:180])
                  finally:
                      state['telegram_update_id']=update['update_id']+1
              if updates:
                  save()
              print('Telegram updates:',len(updates))

          def settle(item,home,away):
              market=item.get('market')
              choice=str(item.get('selection','')).lower().strip()
              teams=re.split(r'\s+v\s+',item.get('fixture',''),maxsplit=1,flags=re.I)
              total=home+away
              if market in ('Result','Full Time Result') and len(teams)==2:
                  if choice in ('draw','x','tie'):
                      return 'win' if home==away else 'loss'
                  if norm(choice)==norm(teams[0]):
                      return 'win' if home>away else 'loss'
                  if norm(choice)==norm(teams[1]):
                      return 'win' if away>home else 'loss'
              if market=='Both Teams to Score':
                  yes=home>0 and away>0
                  if choice=='yes':
                      return 'win' if yes else 'loss'
                  if choice=='no':
                      return 'loss' if yes else 'win'
              if market=='Correct Score':
                  m=re.fullmatch(r'(\d+)\s*[-:]\s*(\d+)',choice)
                  if m:
                      return 'win' if (home,away)==(int(m[1]),int(m[2])) else 'loss'
              if market=='Total Goals':
                  m=re.fullmatch(r'(over|under)\s+(\d+(?:[.,]\d+)?)\s*(?:goals)?',choice)
                  if not m:
                      return None
                  direction=m[1]
                  line=float(m[2].replace(',','.'))
                  if int(round(line*4))%2:
                      low=int(line*2)/2
                      def part(l):
                          if total==l:
                              return 0
                          return 1 if (total>l if direction=='over' else total<l) else -1
                      return {2:'win',1:'half_win',0:'push',-1:'half_loss',-2:'loss'}[part(low)+part(low+0.5)]
                  if total==line:
                      return 'push'
                  return 'win' if (total>line if direction=='over' else total<line) else 'loss'
              return None

          def lookup(item):
              teams=re.split(r'\s+v\s+',str(item.get('fixture','')),maxsplit=1,flags=re.I)
              if len(teams)!=2:
                  return None
              day=item.get('date','')
              url='https://www.thesportsdb.com/api/v1/json/123/searchevents.php?'+\
                  urllib.parse.urlencode({'e':teams[0]+'_vs_'+teams[1],'d':day})
              response=request(url)
              events=response.get('event') or response.get('events') or []
              found=[]
              for e in events:
                  if e.get('strSport')!='Soccer' or e.get('dateEvent')!=day:
                      continue
                  if norm(e.get('strHomeTeam'))!=norm(teams[0]) or norm(e.get('strAwayTeam'))!=norm(teams[1]):
                      continue
                  if str(e.get('strStatus') or '').lower() not in ('match finished','finished','ft','final','full time'):
                      continue
                  try:
                      found.append((int(e['intHomeScore']),int(e['intAwayScore']),e.get('idEvent')))
                  except (TypeError,ValueError,KeyError):
                      continue
              return found[0] if len(found)==1 else None

          try:
              api('setMyCommands',{'commands':json.dumps([{'command':c,'description':d} for c,d in [
                  ('menu','Головне меню'),('stats','Статистика місяця'),('total','Разом'),
                  ('history','Архів'),('pending','Очікують'),('alltime','За весь час')]],ensure_ascii=False)})
          except Exception as exc:
              print('MENU WARNING',str(exc)[:150])

          telegram_updates()
          tips=[]
          failures=[]

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              try:
                  for author,url in SOURCES.items():
                      body,html,method=fetch_page(browser,author,url)
                      try:
                          if body is None:
                              raise ValueError('No verified tips section')
                          parsed=parse_geobetting(body) if author=='Geobetting' else parse_tipstonga(body)
                          odds_from_html(html,parsed)
                          tips.extend(parsed)
                          state.setdefault('source_status',{})[author]={
                              'status':f'✅ перевірено: {len(parsed)} прогнозів',
                              'checked_at':now().strftime('%d.%m.%Y %H:%M'),'method':method}
                          print('CHECKED',author,'tips',len(parsed),'via',method)
                      except Exception as exc:
                          failures.append(author)
                          state.setdefault('source_status',{})[author]={
                              'status':'⚠️ джерело недоступне / не підтверджене',
                              'checked_at':now().strftime('%d.%m.%Y %H:%M'),'reason':str(exc)[:150]}
                          print('UNVERIFIED SOURCE',author,str(exc)[:150])
              finally:
                  browser.close()

          grouped={}
          for t in tips:
              grouped.setdefault(t['match_key'],[]).append(t)

          new=0
          for t in tips:
              if t['id'] not in snaps:
                  snaps[t['id']]={
                      'author':t['author'],
                      'fixture':t['home']+' v '+t['away'],
                      'date':t['date'],
                      'selection':t['selection'],
                      'market':t['market'],
                      'odds_first_seen':t['odds'],
                      'first_seen_at':now().isoformat(timespec='seconds'),
                      'source':t['url'],
                      'result':'pending',
                      'recovered':t['id'] in seen
                  }
              if t['id'] in seen:
                  continue

              msg=(f'⚽ НОВИЙ ПРОГНОЗ\n━━━━━━━━━━━━━\n👤 {t["author"]}\n'
                  f'🏟 {t["home"]} — {t["away"]}\n📅 {t["date"]}\n'
                  f'📊 {MARKETS[t["market"]]}\n🎯 {t["selection"]}\n'
                  f'💰 Коеф. OLBG: {t["odds"] or "н/д"}\n'
                  f'🕘 Виявлено: {now():%d.%m.%Y %H:%M} (Київ)\n')

              if t['time']:
                  msg+='🕒 Час OLBG: '+t['time']+'\n'

              other=[x for x in grouped.get(t['match_key'],[]) if x['author']!=t['author']]
              other += [x for x in matches.get(t['match_key'],[]) if x.get('author',x.get('tipster'))!=t['author']]
              if other:
                  msg+='\n⚠️ ІНШИЙ КАППЕР НА ЦЕЙ МАТЧ:\n'
                  unique={(x.get('author',x.get('tipster')),x['market'],x['selection']):x for x in other}
                  for x in unique.values():
                      msg+='• '+str(x.get('author',x.get('tipster')))+': '+x['selection']+'\n'

              msg+='\n🔗 '+t['url']
              send(msg,[[('📊 Статистика','stats'),('🏠 Меню','menu')]])
              seen.add(t['id'])
              prior=matches.setdefault(t['match_key'],[])
              if not any(x.get('author',x.get('tipster'))==t['author'] and x.get('market')==t['market'] and x.get('selection')==t['selection'] for x in prior):
                  prior.append({'author':t['author'],'market':t['market'],'selection':t['selection']})
              save()
              new+=1

          completed=0
          cache={}

          for item in snaps.values():
              if item.get('result','pending')!='pending':
                  continue
              if item.get('market') not in ('Result','Full Time Result','Both Teams to Score','Total Goals','Correct Score'):
                  continue
              try:
                  age=(now().date()-datetime.strptime(item['date'],'%Y-%m-%d').date()).days
              except (KeyError,TypeError,ValueError):
                  continue
              if not 1<=age<=21:
                  continue
              ident=(item.get('fixture'),item.get('date'))
              if ident not in cache:
                  try:
                      cache[ident]=lookup(item)
                  except Exception as exc:
                      cache[ident]=None
                      print('RESULT LOOKUP WARNING',str(exc)[:100])
              if cache[ident] is None:
                  continue
              home,away,event_id=cache[ident]
              result=settle(item,home,away)
              if result is None:
                  continue
              item.update(result=result,settled_at=now().isoformat(timespec='seconds'),
                          final_score=f'{home}:{away}',result_source='TheSportsDB '+str(event_id))
              completed+=1
              print('AUTO SETTLED',item['author'],item['fixture'],result)

          if completed:
              save()
              send(f'✅ Автоматично розраховано: {completed} прогнозів.\n\n'
                  +report(month_start(now()),shift(month_start(now()),1),now().strftime('%m.%Y')),MENU)

          failures=sorted(set(failures))
          previous=sorted(state.get('unavailable_sources',[]))

          if failures!=previous:
              if failures:
                  send('⚠️ OLBG: не вдалося перевірити '+', '.join(failures)
                      +'. Це НЕ означає відсутність прогнозів. Архів збережено.',BACK)
              elif previous:
                  send('✅ Перевірка всіх джерел відновлена.',BACK)

          state['unavailable_sources']=failures
          dt=now()

          if dt.day==1:
              prior=shift(month_start(dt),-1)
              period=prior.strftime('%Y-%m')
              if state.get('last_monthly_report')!=period:
                  send(report(prior,month_start(dt),'ПІДСУМКИ '+period),MENU)
                  state['last_monthly_report']=period

          save()
          print('SUMMARY new:',new,'auto_settled:',completed,'unverified:',failures)
          print('Monitoring complete')
          PY
