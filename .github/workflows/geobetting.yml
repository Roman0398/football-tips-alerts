
name: Football Tips Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: football-tips-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser and HTML parser
        run: |
          python -m pip install playwright beautifulsoup4
          python -m playwright install --with-deps chromium

      - name: Monitor both tipsters
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -u - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import unicodedata
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          SOURCES = {
              "Geobetting": "https://www.olbg.com/tipsters/tips/420769",
              "tipstonga": "https://www.olbg.com/best-tipsters/Football/1/13000",
          }

          STATE = Path(".state/football-tips.json")
          KYIV = ZoneInfo("Europe/Kyiv")
          LONDON = ZoneInfo("Europe/London")

          MARKETS = {
              "Full Time Result": "Результат матчу",
              "Result": "Результат матчу",
              "Total Goals": "Тотал голів",
              "Both Teams to Score": "Обидві заб'ють",
              "Asian Hcap": "Азійська фора",
              "Result and BTTS": "Результат + ОЗ",
              "Total Corners": "Кутові",
              "Total Cards": "Картки",
              "Correct Score": "Точний рахунок",
              "Half Time Result": "Результат 1-го тайму",
              "Half Time/Full Time": "Тайм / матч",
              "Anytime Goalscorer": "Автор гола",
              "First Goalscorer": "Перший гол",
          }

          ALIASES = {
              "man utd": "manchester united",
              "man united": "manchester united",
              "man city": "manchester city",
              "spurs": "tottenham hotspur",
              "tottenham": "tottenham hotspur",
              "inter milan": "internazionale",
              "ac milan": "milan",
              "bayern": "bayern munich",
              "psg": "paris saint germain",
              "barca": "barcelona",
              "fc barcelona": "barcelona",
              "roma": "as roma",
              "as monaco": "monaco",
              "leverkusen": "bayer leverkusen",
              "wolves": "wolverhampton wanderers",
              "newcastle": "newcastle united",
              "west ham": "west ham united",
              "nottm forest": "nottingham forest",
          }

          FIXTURE = re.compile(
              r"^(?:(\d{1,2}:\d{2})\s+)?(.+?)\s+v\s+(.+)$",
              re.I
          )
          DATE = re.compile(r"^\d{1,2} [A-Za-z]+ 20\d{2}$")
          CLOCK = re.compile(r"^\d{1,2}:\d{2}$")

          def normalize(name):
              value = unicodedata.normalize("NFKD", name.casefold())
              value = "".join(
                  c for c in value
                  if not unicodedata.combining(c)
              )
              value = re.sub(r"[^a-z0-9]+", " ", value).strip()
              return ALIASES.get(value, value)

          def make_tip(author, day, clock, home, away, market, selection):
              match = day + "|" + "|".join(
                  sorted([normalize(home), normalize(away)])
              )
              raw = "|".join([
                  author, match, market, selection.casefold().strip()
              ])
              return {
                  "id": hashlib.sha256(raw.encode("utf-8")).hexdigest(),
                  "author": author,
                  "date": day,
                  "time": clock,
                  "home": home,
                  "away": away,
                  "market": market,
                  "selection": selection,
                  "match_key": match,
                  "url": SOURCES[author],
                  "odds": None,
              }

          def page_data(browser, url):
              page = browser.new_page(
                  viewport={"width": 1280, "height": 900}
              )
              try:
                  response = page.goto(
                      url,
                      wait_until="domcontentloaded",
                      timeout=45000
                  )
                  if response and response.status >= 400:
                      raise RuntimeError("HTTP " + str(response.status))

                  try:
                      page.get_by_text(
                          "Accept all", exact=True
                      ).last.click(timeout=2000)
                  except Exception:
                      pass

                  page.wait_for_timeout(3500)
                  text = page.locator("body").inner_text(
                      timeout=12000
                  )
                  html = page.content()

                  print("Opened:", page.url, "characters:", len(text))
                  return text, html
              finally:
                  page.close()

          def parse_geobetting(text):
              lower = text.lower()

              if "geobetting's tips" not in lower:
                  raise RuntimeError("Geobetting heading missing")

              if "geobetting has no current tips" in lower:
                  print("Geobetting: no active tips")
                  return []

              lines = [
                  x.strip() for x in text.splitlines()
                  if x.strip()
              ]
              start = next(
                  i for i, x in enumerate(lines)
                  if "geobetting's tips" in x.lower()
              )
              lines = lines[start + 1:]

              for i, line in enumerate(lines):
                  if "Tips are normally settled" in line:
                      lines = lines[:i]
                      break

              day = home = away = clock = None
              results = []

              for i, line in enumerate(lines):
                  if DATE.fullmatch(line):
                      day = datetime.strptime(
                          line, "%d %B %Y"
                      ).date().isoformat()
                      home = away = clock = None
                      continue

                  fixture = FIXTURE.fullmatch(line)
                  if fixture and day:
                      clock, home, away = fixture.groups()
                      continue

                  if line not in MARKETS or not day or not home or i == 0:
                      continue

                  selection = lines[i - 1]

                  if (
                      selection in MARKETS
                      or selection in ("@", "WIN", "50 WIN")
                      or FIXTURE.fullmatch(selection)
                      or len(selection) > 120
                  ):
                      continue

                  results.append(make_tip(
                      "Geobetting", day, clock,
                      home, away, line, selection
                  ))

              unique = {x["id"]: x for x in results}
              print("Geobetting: recognized", len(unique), "tips")

              if not unique and any(
                  DATE.fullmatch(x) for x in lines
              ):
                  raise RuntimeError("Geobetting active tips not parsed")

              return list(unique.values())

          def parse_tipstonga(text):
              lines = [
                  x.strip() for x in text.splitlines()
                  if x.strip()
              ]

              if not any(
                  x.casefold() == "tipstonga" for x in lines
              ):
                  raise RuntimeError("tipstonga profile missing")

              if "Today Tips" not in lines:
                  raise RuntimeError("tipstonga Today Tips section missing")

              lines = lines[lines.index("Today Tips") + 1:]

              for i, line in enumerate(lines):
                  if line.startswith("Profits calculated to a"):
                      lines = lines[:i]
                      break

              today = datetime.now(LONDON).date()
              results = []
              fixtures_found = 0

              for i, item in enumerate(lines):
                  fixture = FIXTURE.fullmatch(item)
                  if not fixture or i == 0:
                      continue

                  fixtures_found += 1
                  fixture_clock, home, away = fixture.groups()
                  selection = lines[i - 1]

                  if (
                      selection in MARKETS
                      or selection in (
                          "SELECTION", "WIN", "ODDS", "VALUE RATING"
                      )
                      or len(selection) > 100
                  ):
                      continue

                  following = lines[i + 1:i + 8]
                  market = next(
                      (x for x in following if x in MARKETS),
                      None
                  )

                  if not market:
                      continue

                  day = None
                  clock = fixture_clock

                  for j, value in enumerate(following):
                      if value in ("Today", "Tomorrow"):
                          offset = 1 if value == "Tomorrow" else 0
                          day = (
                              today + timedelta(days=offset)
                          ).isoformat()

                          if (
                              j + 1 < len(following)
                              and CLOCK.fullmatch(following[j + 1])
                          ):
                              clock = following[j + 1]
                          break

                      if DATE.fullmatch(value):
                          day = datetime.strptime(
                              value, "%d %B %Y"
                          ).date().isoformat()
                          break

                  if not day or not clock:
                      raise RuntimeError(
                          "tipstonga date/time not parsed: " + item
                      )

                  results.append(make_tip(
                      "tipstonga", day, clock,
                      home, away, market, selection
                  ))

              unique = {x["id"]: x for x in results}

              print(
                  "tipstonga: recognized",
                  len(unique), "football tips"
              )

              if fixtures_found and len(unique) != fixtures_found:
                  raise RuntimeError(
                      "Some tipstonga fixtures not parsed: "
                      + str(fixtures_found)
                      + " found, "
                      + str(len(unique))
                      + " parsed"
                  )

              if not fixtures_found:
                  print("tipstonga: no active tips")

              return list(unique.values())

          def add_verified_odds(html, tips):
              if not tips:
                  return

              soup = BeautifulSoup(html, "html.parser")
              odds_nodes = soup.select(
                  "span.ui-odds[data-decimal]"
              )

              print("HTML decimal odds nodes:", len(odds_nodes))

              candidates = {
                  tip["id"]: set() for tip in tips
              }

              for node in odds_nodes:
                  raw = node.get("data-decimal", "")

                  if not re.fullmatch(r"\d+(?:\.\d+)?", raw):
                      continue

                  if not 1.01 <= float(raw) <= 1000:
                      continue

                  for parent in node.parents:
                      if parent.name in (
                          "body", "html", "[document]"
                      ):
                          break

                      body = " ".join(parent.stripped_strings)

                      if len(body) > 3500:
                          break

                      belonging = []

                      for tip in tips:
                          fixture_pattern = (
                              r"(?<!\w)"
                              + re.escape(tip["home"])
                              + r"\s+v\s+"
                              + re.escape(tip["away"])
                              + r"(?!\w)"
                          )

                          if re.search(
                              fixture_pattern, body, re.I
                          ):
                              belonging.append(tip)

                      if len(belonging) == 1:
                          count = len(parent.select(
                              "span.ui-odds[data-decimal]"
                          ))

                          if count == 1:
                              tip = belonging[0]
                              body_lower = body.casefold()

                              if (
                                  tip["selection"].casefold() in body_lower
                                  and tip["market"].casefold() in body_lower
                              ):
                                  candidates[tip["id"]].add(raw)
                          break

              for tip in tips:
                  values = candidates[tip["id"]]

                  if len(values) == 1:
                      tip["odds"] = next(iter(values))
                      print(
                          "Verified odds:",
                          tip["author"],
                          tip["home"], "v", tip["away"],
                          tip["odds"]
                      )
                  else:
                      print(
                          "Odds unavailable/unverified:",
                          tip["author"],
                          tip["home"], "v", tip["away"]
                      )

          def translate(selection, market):
              s = selection.strip()

              if market in ("Full Time Result", "Result"):
                  if s.casefold() in ("draw", "x"):
                      return "Нічия"
                  return "Перемога: " + s

              if market == "Both Teams to Score":
                  if s.lower().startswith("yes"):
                      return "Так"
                  if s.lower().startswith("no"):
                      return "Ні"

              s = re.sub(r"^Over\s+", "Більше ", s, flags=re.I)
              s = re.sub(r"^Under\s+", "Менше ", s, flags=re.I)
              s = s.replace("(AH)", "(азійська фора)")
              return re.sub(r"(?<=\d)\.(?=\d)", ",", s)

          def telegram(message):
              token = os.getenv("BOT_TOKEN")
              chat = os.getenv("CHAT_ID")

              if not token or not chat:
                  raise RuntimeError("Telegram secrets missing")

              url = (
                  "https://api.telegram.org/bot"
                  + token + "/sendMessage"
              )
              payload = urllib.parse.urlencode({
                  "chat_id": chat,
                  "text": message,
                  "disable_notification": "false",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")

              with urllib.request.urlopen(
                  url, data=payload, timeout=30
              ) as response:
                  answer = json.load(response)

              if not answer.get("ok"):
                  raise RuntimeError("Telegram delivery failed")

          def save_state(state):
              STATE.parent.mkdir(
                  parents=True, exist_ok=True
              )
              STATE.write_text(
                  json.dumps(
                      state,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              subprocess.run(
                  ["git", "add", str(STATE)],
                  check=True
              )

              changed = subprocess.run([
                  "git", "diff", "--cached", "--quiet"
              ])

              if changed.returncode == 0:
                  return

              subprocess.run([
                  "git",
                  "-c", "user.name=github-actions[bot]",
                  "-c",
                  "user.email=41898282+github-actions[bot]@users.noreply.github.com",
                  "commit",
                  "-m", "Update football tips history",
              ], check=True)

              subprocess.run([
                  "git", "push", "origin", "HEAD:main"
              ], check=True)

          if STATE.exists():
              state = json.loads(
                  STATE.read_text(encoding="utf-8")
              )
          else:
              state = {
                  "seen": [],
                  "matches": {}
              }

          seen = set(state.get("seen", []))
          matches = state.get("matches", {})
          snapshots = state.get("snapshots", {})
          all_tips = []
          errors = []

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(
                  headless=True
              )

              try:
                  for author, url in SOURCES.items():
                      try:
                          print("Checking:", author)
                          text, html = page_data(browser, url)

                          if author == "Geobetting":
                              tips = parse_geobetting(text)
                          else:
                              tips = parse_tipstonga(text)

                          add_verified_odds(html, tips)
                          all_tips.extend(tips)

                      except Exception as exc:
                          errors.append(author)
                          print("ERROR:", author, str(exc))
              finally:
                  browser.close()

          pending = [
              tip for tip in all_tips
              if tip["id"] not in seen
          ]

          print("New tips:", len(pending))

          current_matches = {}
          for tip in all_tips:
              current_matches.setdefault(
                  tip["match_key"], []
              ).append(tip)

          for tip in pending:
              now = datetime.now(KYIV)

              if tip["id"] not in snapshots:
                  snapshots[tip["id"]] = {
                      "author": tip["author"],
                      "fixture": tip["home"] + " v " + tip["away"],
                      "selection": tip["selection"],
                      "market": tip["market"],
                      "odds_first_seen": tip["odds"],
                      "first_seen_at": now.isoformat(timespec="seconds"),
                      "source": tip["url"],
                  }

              snapshot = snapshots[tip["id"]]
              fixture = tip["home"] + " — " + tip["away"]

              message = (
                  "⚽ НОВИЙ ПРОГНОЗ\n\n"
                  f"👤 Каппер: {tip['author']}\n"
                  f"🏟 Матч: {fixture}\n"
                  f"📅 Дата: {tip['date']}\n"
                  f"📊 Ринок: {MARKETS[tip['market']]}\n"
                  f"🎯 Ставка: "
                  f"{translate(tip['selection'], tip['market'])}\n"
              )

              if tip["time"]:
                  message += (
                      f"🕒 Час матчу OLBG: {tip['time']}\n"
                  )

              fixed_odds = snapshot["odds_first_seen"]

              if fixed_odds is not None:
                  odds_ua = fixed_odds.replace(".", ",")
                  message += (
                      f"💰 Коефіцієнт OLBG: {odds_ua}\n"
                  )
              else:
                  message += (
                      "💰 Коефіцієнт OLBG: недоступний\n"
                  )

              observed = datetime.fromisoformat(
                  snapshot["first_seen_at"]
              ).astimezone(KYIV)

              message += (
                  "🕘 Зафіксовано ботом: "
                  + observed.strftime("%d.%m.%Y о %H:%M")
                  + " (Київ)\n"
              )

              previous = matches.get(
                  tip["match_key"], []
              )
              other = []

              for old in previous:
                  old_author = old.get(
                      "author", old.get("tipster")
                  )

                  if old_author != tip["author"]:
                      other.append({
                          "author": old_author,
                          "market": old["market"],
                          "selection": old["selection"],
                      })

              for current in current_matches.get(
                  tip["match_key"], []
              ):
                  if (
                      current["author"] != tip["author"]
                      and not any(
                          x["author"] == current["author"]
                          and x["market"] == current["market"]
                          and x["selection"] == current["selection"]
                          for x in other
                      )
                  ):
                      other.append(current)

              if other:
                  message += (
                      "\n⚠️ ЗБІГ МАТЧУ!\n"
                      "Другий каппер теж має прогноз "
                      "на цей матч:\n"
                  )

                  for old in other:
                      market_label = MARKETS.get(
                          old["market"], old["market"]
                      )
                      message += (
                          f"• {old['author']}: "
                          f"{market_label} — "
                          f"{translate(old['selection'], old['market'])}\n"
                      )

                  message += "Врахуй сумарний ризик.\n"

              message += (
                  "\n📌 Порівняй цей коефіцієнт із BetKing"
                  "\n🔗 " + tip["url"]
              )

              telegram(message)
              seen.add(tip["id"])

              old_entries = matches.setdefault(
                  tip["match_key"], []
              )

              if not any(
                  x.get("author", x.get("tipster")) == tip["author"]
                  and x.get("market") == tip["market"]
                  and x.get("selection") == tip["selection"]
                  for x in old_entries
              ):
                  old_entries.append({
                      "author": tip["author"],
                      "market": tip["market"],
                      "selection": tip["selection"],
                  })

              save_state({
                  "seen": sorted(seen),
                  "matches": matches,
                  "snapshots": snapshots,
              })

              print(
                  "Sent and saved:",
                  tip["author"], fixture,
                  "first odds:", fixed_odds,
                  "at:", snapshot["first_seen_at"]
              )

          if errors:
              raise RuntimeError(
                  "Failed sources: " + ", ".join(errors)
              )

          print("Monitoring complete")
          PY
