
name: Football Tips Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: football-tips-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install chromium

      - name: Monitor both tipsters
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import unicodedata
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          TIPSTERS = {
              "Geobetting": "420769",
              "tipstonga": "13000",
          }

          STATE_FILE = Path(".state/football-tips.json")

          MARKETS = {
              "Full Time Result": "Результат матчу",
              "Result": "Результат матчу",
              "Total Goals": "Тотал голів",
              "Both Teams to Score": "Обидві заб'ють",
              "Asian Hcap": "Азійська фора",
              "Result and BTTS": "Результат + обидві заб'ють",
              "Total Corners": "Тотал кутових",
              "Total Cards": "Тотал карток",
              "Correct Score": "Точний рахунок",
              "Half Time Result": "Результат першого тайму",
              "Half Time/Full Time": "Тайм / матч",
              "Anytime Goalscorer": "Автор гола",
              "First Goalscorer": "Перший автор гола",
          }

          MONTHS = {
              "January": "січня",
              "February": "лютого",
              "March": "березня",
              "April": "квітня",
              "May": "травня",
              "June": "червня",
              "July": "липня",
              "August": "серпня",
              "September": "вересня",
              "October": "жовтня",
              "November": "листопада",
              "December": "грудня",
          }

          ALIASES = {
              "man utd": "manchester united",
              "man united": "manchester united",
              "manchester utd": "manchester united",
              "man city": "manchester city",
              "spurs": "tottenham hotspur",
              "tottenham": "tottenham hotspur",
              "inter milan": "internazionale",
              "inter milano": "internazionale",
              "ac milan": "milan",
              "bayern": "bayern munich",
              "bayern munchen": "bayern munich",
              "psg": "paris saint germain",
              "paris sg": "paris saint germain",
              "atletico de madrid": "atletico madrid",
              "barca": "barcelona",
              "fc barcelona": "barcelona",
              "copenhagen": "kobenhavn",
              "fc copenhagen": "kobenhavn",
              "red star belgrade": "crvena zvezda",
              "olympiakos": "olympiacos",
              "sporting cp": "sporting lisbon",
              "roma": "as roma",
              "as monaco": "monaco",
              "leverkusen": "bayer leverkusen",
              "wolves": "wolverhampton wanderers",
              "newcastle": "newcastle united",
              "west ham": "west ham united",
              "nottm forest": "nottingham forest",
          }

          DATE_RE = re.compile(
              r"^\d{1,2} [A-Za-z]+ 20\d{2}$"
          )

          FIXTURE_RE = re.compile(
              r"^(?:(\d{1,2}:\d{2})\s+)?(.+?)\s+v\s+(.+)$",
              re.I,
          )

          def normalize_team(name):
              value = unicodedata.normalize(
                  "NFKD", name.casefold()
              )
              value = "".join(
                  c for c in value
                  if not unicodedata.combining(c)
              )
              value = re.sub(
                  r"[^a-z0-9]+", " ", value
              ).strip()
              value = re.sub(r"\s+", " ", value)
              return ALIASES.get(value, value)

          def match_key(day, home, away):
              teams = sorted([
                  normalize_team(home),
                  normalize_team(away),
              ])
              return day + "|" + "|".join(teams)

          def translate(selection, market):
              value = selection.strip()

              if market in (
                  "Full Time Result", "Result"
              ):
                  if value.lower() in ("draw", "x"):
                      return "Нічия"
                  return "Перемога: " + value

              if re.fullmatch(
                  r"Yes\s*\(BTTS\)", value, re.I
              ):
                  return "Обидві заб'ють — Так"

              if re.fullmatch(
                  r"No\s*\(BTTS\)", value, re.I
              ):
                  return "Обидві заб'ють — Ні"

              value = re.sub(
                  r"^Over\s+", "Більше ",
                  value, flags=re.I
              )
              value = re.sub(
                  r"^Under\s+", "Менше ",
                  value, flags=re.I
              )
              value = value.replace(
                  "(AH)", "(азійська фора)"
              )
              return re.sub(
                  r"(?<=\d)\.(?=\d)", ",", value
              )

          def date_uk(day):
              d = datetime.strptime(
                  day, "%Y-%m-%d"
              )
              month = MONTHS[d.strftime("%B")]
              return f"{d.day} {month} {d.year}"

          def send_telegram(message):
              token = os.getenv("BOT_TOKEN")
              chat_id = os.getenv("CHAT_ID")

              if not token or not chat_id:
                  raise RuntimeError(
                      "Telegram secrets are missing"
                  )

              url = (
                  "https://api.telegram.org/bot"
                  + token + "/sendMessage"
              )

              data = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": message,
                  "disable_notification": "false",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")

              with urllib.request.urlopen(
                  url, data=data, timeout=30
              ) as response:
                  result = json.load(response)

              if not result.get("ok"):
                  raise RuntimeError(
                      "Telegram rejected the message"
                  )

          def read_tips(browser, name, user_id):
              url = (
                  "https://www.olbg.com/tipsters/tips/"
                  + user_id
              )

              page = browser.new_page(
                  viewport={"width": 390, "height": 844}
              )

              try:
                  page.goto(
                      url,
                      wait_until="domcontentloaded",
                      timeout=60000,
                  )

                  try:
                      page.get_by_text(
                          "Accept all", exact=True
                      ).last.click(timeout=2500)
                  except Exception:
                      pass

                  page.wait_for_timeout(4000)

                  body = page.locator(
                      "body"
                  ).inner_text()

              finally:
                  page.close()

              title = name.lower() + "'s tips"

              if title not in body.lower():
                  raise RuntimeError(
                      "Tips heading not found: " + name
                  )

              lines = [
                  line.strip()
                  for line in body.splitlines()
                  if line.strip()
              ]

              start = next(
                  i for i, line in enumerate(lines)
                  if title in line.lower()
              )

              lines = lines[start + 1:]

              # Only inspect the Current Tips section.
              for i, line in enumerate(lines):
                  if "Tips are normally settled" in line:
                      lines = lines[:i]
                      break

              # Both OLBG empty-page variants:
              # 1. "has no current tips"
              # 2. Empty section with no dates or matches.
              section = " ".join(lines).lower()

              if "has no current tips" in section:
                  print(name, ": no active tips")
                  return []

              has_date = any(
                  DATE_RE.fullmatch(line)
                  for line in lines
              )

              has_fixture = any(
                  FIXTURE_RE.fullmatch(line)
                  for line in lines
              )

              if not has_date and not has_fixture:
                  print(
                      name,
                      ": no active tips (empty section)"
                  )
                  return []

              if not has_date or not has_fixture:
                  raise RuntimeError(
                      "Unexpected tip format for " + name
                  )

              current_day = None
              home = None
              away = None
              clock = None
              results = []

              for i, item in enumerate(lines):
                  if DATE_RE.fullmatch(item):
                      current_day = datetime.strptime(
                          item, "%d %B %Y"
                      ).date().isoformat()
                      home = None
                      away = None
                      clock = None
                      continue

                  fixture = FIXTURE_RE.fullmatch(
                      item
                  )

                  if fixture:
                      clock, home, away = (
                          fixture.groups()
                      )
                      continue

                  if item not in MARKETS:
                      continue

                  if not home or not current_day:
                      continue

                  if i == 0:
                      continue

                  selection = lines[i - 1]

                  if (
                      not selection
                      or selection in MARKETS
                      or selection in ("@", "WIN", "50 WIN")
                      or len(selection) > 120
                      or FIXTURE_RE.fullmatch(selection)
                  ):
                      continue

                  identity = match_key(
                      current_day, home, away
                  )

                  raw = "|".join([
                      name,
                      identity,
                      item,
                      selection,
                  ])

                  tip_id = hashlib.sha256(
                      raw.encode("utf-8")
                  ).hexdigest()

                  results.append({
                      "id": tip_id,
                      "tipster": name,
                      "date": current_day,
                      "clock": clock,
                      "home": home,
                      "away": away,
                      "market": item,
                      "selection": selection,
                      "match_key": identity,
                      "url": url,
                  })

              unique = {
                  tip["id"]: tip
                  for tip in results
              }

              print(
                  name,
                  ": recognized",
                  len(unique),
                  "tips"
              )

              if not unique:
                  raise RuntimeError(
                      "Active tips not parsed: " + name
                  )

              return list(unique.values())

          def save_state(state):
              STATE_FILE.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              STATE_FILE.write_text(
                  json.dumps(
                      state,
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )

              subprocess.run([
                  "git", "add", str(STATE_FILE)
              ], check=True)

              diff = subprocess.run([
                  "git", "diff",
                  "--cached", "--quiet",
              ])

              if diff.returncode == 0:
                  return

              subprocess.run([
                  "git",
                  "-c",
                  "user.name=github-actions[bot]",
                  "-c",
                  "user.email=41898282+github-actions[bot]@users.noreply.github.com",
                  "commit",
                  "-m",
                  "Save football tips state",
              ], check=True)

              subprocess.run([
                  "git", "push",
                  "origin", "HEAD:main",
              ], check=True)

          if STATE_FILE.exists():
              state = json.loads(
                  STATE_FILE.read_text(
                      encoding="utf-8"
                  )
              )
          else:
              state = {
                  "seen": [],
                  "matches": {},
              }

          seen = set(
              state.get("seen", [])
          )

          matches = state.get(
              "matches", {}
          )

          collected = []
          errors = []

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(
                  headless=True
              )

              try:
                  for name, user_id in TIPSTERS.items():
                      try:
                          tips = read_tips(
                              browser,
                              name,
                              user_id,
                          )
                          collected.extend(tips)

                      except Exception as error:
                          errors.append(name)
                          print(
                              "ERROR:",
                              name,
                              str(error),
                          )
              finally:
                  browser.close()

          pending = [
              tip for tip in collected
              if tip["id"] not in seen
          ]

          print("New tips:", len(pending))

          for tip in pending:
              previous = matches.get(
                  tip["match_key"], []
              )

              other = [
                  p for p in previous
                  if p["tipster"] != tip["tipster"]
              ]

              fixture = (
                  tip["home"]
                  + " — "
                  + tip["away"]
              )

              message = (
                  "⚽ НОВИЙ ПРОГНОЗ\n\n"
                  f"👤 Каппер: {tip['tipster']}\n"
                  f"🏟 Матч: {fixture}\n"
                  f"📅 Дата: {date_uk(tip['date'])}\n"
                  f"📊 Ринок: {MARKETS[tip['market']]}\n"
                  f"🎯 Ставка: "
                  f"{translate(tip['selection'], tip['market'])}\n"
              )

              if tip["clock"]:
                  message += (
                      f"🕒 Час OLBG: {tip['clock']}\n"
                  )

              message += (
                  "📌 Перевір коефіцієнт "
                  "у букмекера\n"
              )

              if other:
                  message += (
                      "\n⚠️ ЗБІГ ПРОГНОЗІВ!\n"
                      "Інший каппер також "
                      "обрав цей матч.\n"
                  )

                  for old in other:
                      message += (
                          f"• {old['tipster']}: "
                          f"{translate(old['selection'], old['market'])}\n"
                      )

                  message += (
                      "Врахуй сумарний ризик ставок.\n"
                  )

              message += (
                  "\n🔗 " + tip["url"]
              )

              send_telegram(message)

              seen.add(tip["id"])

              matches.setdefault(
                  tip["match_key"], []
              ).append({
                  "tipster": tip["tipster"],
                  "market": tip["market"],
                  "selection": tip["selection"],
              })

              state = {
                  "seen": sorted(seen),
                  "matches": matches,
              }

              save_state(state)

              print(
                  "Sent:",
                  tip["tipster"],
                  fixture,
              )

          if errors:
              raise RuntimeError(
                  "Could not check: "
                  + ", ".join(errors)
              )

          print("Monitoring complete")
          PY
