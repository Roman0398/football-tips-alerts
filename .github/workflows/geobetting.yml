
name: Football Tips Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: football-tips-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install chromium

      - name: Monitor both tipsters
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -u - <<'PY'
          import json
          import os
          import re
          import hashlib
          import subprocess
          import unicodedata
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from playwright.sync_api import sync_playwright

          SOURCES = {
              "Geobetting": (
                  "https://www.olbg.com/tipsters/tips/420769"
              ),
              "tipstonga": (
                  "https://www.olbg.com/best-tipsters/Football/1/13000"
              ),
          }

          STATE_PATH = Path(".state/football-tips.json")

          MARKETS = {
              "Full Time Result": "Результат матчу",
              "Result": "Результат матчу",
              "Total Goals": "Тотал голів",
              "Both Teams to Score": "Обидві заб'ють",
              "Asian Hcap": "Азійська фора",
              "Result and BTTS": "Результат + ОЗ",
              "Total Corners": "Кутові",
              "Total Cards": "Картки",
              "Correct Score": "Точний рахунок",
              "Half Time Result": "Результат 1-го тайму",
              "Half Time/Full Time": "Тайм / матч",
              "Anytime Goalscorer": "Автор гола",
              "First Goalscorer": "Перший гол",
          }

          ALIASES = {
              "man utd": "manchester united",
              "man united": "manchester united",
              "man city": "manchester city",
              "spurs": "tottenham hotspur",
              "tottenham": "tottenham hotspur",
              "inter milan": "internazionale",
              "inter milano": "internazionale",
              "ac milan": "milan",
              "bayern": "bayern munich",
              "bayern munchen": "bayern munich",
              "psg": "paris saint germain",
              "paris sg": "paris saint germain",
              "barca": "barcelona",
              "fc barcelona": "barcelona",
              "roma": "as roma",
              "as monaco": "monaco",
              "leverkusen": "bayer leverkusen",
              "wolves": "wolverhampton wanderers",
              "newcastle": "newcastle united",
              "west ham": "west ham united",
              "nottm forest": "nottingham forest",
              "copenhagen": "kobenhavn",
              "fc copenhagen": "kobenhavn",
              "red star belgrade": "crvena zvezda",
          }

          DATE_RE = re.compile(
              r"^\d{1,2} [A-Za-z]+ 20\d{2}$"
          )

          FIXTURE_RE = re.compile(
              r"^(?:(\d{1,2}:\d{2})\s+)?"
              r"(.+?)\s+v\s+(.+)$",
              re.I
          )

          TIME_RE = re.compile(
              r"^(Today|Tomorrow)\s+"
              r"(\d{1,2}:\d{2})$",
              re.I
          )

          def uk_now():
              return datetime.now(
                  ZoneInfo("Europe/Kyiv")
              )

          def london_today():
              return datetime.now(
                  ZoneInfo("Europe/London")
              ).date()

          def normalize(name):
              value = unicodedata.normalize(
                  "NFKD", name.casefold()
              )
              value = "".join(
                  c for c in value
                  if not unicodedata.combining(c)
              )
              value = re.sub(
                  r"[^a-z0-9]+", " ", value
              ).strip()
              value = re.sub(r"\s+", " ", value)
              return ALIASES.get(value, value)

          def fixture_key(day, home, away):
              teams = sorted([
                  normalize(home),
                  normalize(away)
              ])
              return day + "|" + "|".join(teams)

          def tip_record(
              author, day, time, home,
              away, market, selection
          ):
              key = fixture_key(day, home, away)

              raw = "|".join([
                  author, key,
                  market, selection.casefold()
              ])

              tip_id = hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()

              return {
                  "id": tip_id,
                  "author": author,
                  "date": day,
                  "time": time,
                  "home": home,
                  "away": away,
                  "market": market,
                  "selection": selection,
                  "match_key": key,
                  "url": SOURCES[author],
              }

          def extract_page(browser, url):
              page = browser.new_page(
                  viewport={
                      "width": 1280,
                      "height": 900,
                  }
              )

              try:
                  response = page.goto(
                      url,
                      wait_until="domcontentloaded",
                      timeout=35000
                  )

                  if response and response.status >= 400:
                      raise RuntimeError(
                          "HTTP " + str(response.status)
                      )

                  try:
                      page.get_by_text(
                          "Accept all", exact=True
                      ).last.click(timeout=1800)
                  except Exception:
                      pass

                  page.wait_for_timeout(3000)

                  actual_url = page.url
                  text = page.locator(
                      "body"
                  ).inner_text(timeout=12000)

                  print(
                      "Opened:",
                      actual_url,
                      "characters:",
                      len(text)
                  )

                  return text

              finally:
                  page.close()

          def parse_geobetting(text):
              if "geobetting's tips" not in text.lower():
                  raise RuntimeError(
                      "Geobetting heading missing"
                  )

              if "geobetting has no current tips" in text.lower():
                  print("Geobetting: no active tips")
                  return []

              lines = [
                  x.strip()
                  for x in text.splitlines()
                  if x.strip()
              ]

              start = next(
                  i for i, x in enumerate(lines)
                  if "geobetting's tips" in x.lower()
              )

              lines = lines[start + 1:]

              for i, line in enumerate(lines):
                  if "Tips are normally settled" in line:
                      lines = lines[:i]
                      break

              day = None
              home = None
              away = None
              clock = None
              results = []

              for i, line in enumerate(lines):
                  if DATE_RE.fullmatch(line):
                      day = datetime.strptime(
                          line, "%d %B %Y"
                      ).date().isoformat()
                      home = away = clock = None
                      continue

                  fm = FIXTURE_RE.fullmatch(line)

                  if fm and day:
                      clock, home, away = fm.groups()
                      continue

                  if (
                      line not in MARKETS
                      or not day or not home or i == 0
                  ):
                      continue

                  selection = lines[i - 1]

                  if (
                      selection in MARKETS
                      or selection in ("@", "WIN", "50 WIN")
                      or FIXTURE_RE.fullmatch(selection)
                      or len(selection) > 120
                  ):
                      continue

                  results.append(tip_record(
                      "Geobetting",
                      day, clock,
                      home, away, line, selection
                  ))

              unique = {
                  x["id"]: x for x in results
              }

              print(
                  "Geobetting: recognized",
                  len(unique), "tips"
              )

              if not unique and any(
                  DATE_RE.fullmatch(x) for x in lines
              ):
                  raise RuntimeError(
                      "Geobetting tips not parsed"
                  )

              return list(unique.values())

          
          def parse_tipstonga(text):
              print("TIPSTONGA PAGE DIAGNOSTICS")
              print("Contains tipstonga:",
                    "tipstonga" in text.lower())
              print("Contains Sassuolo:",
                    "sassuolo" in text.lower())
              print("Contains Full Time Result:",
                    "full time result" in text.lower())
              print("PAGE TEXT START:")
              print(text[:5000])
              print("PAGE TEXT END")

              # OLBG football profile, not general Tips page.
              if not re.search(
                  r"tipstonga['’]s tips",
                  text, re.I
              ):
                  raise RuntimeError(
                      "tipstonga football heading missing"
                  )

              lines = [
                  x.strip()
                  for x in text.splitlines()
                  if x.strip()
              ]

              start = next(
                  i for i, x in enumerate(lines)
                  if re.search(
                      r"tipstonga['’]s tips",
                      x, re.I
                  )
              )

              lines = lines[start + 1:]

              for i, line in enumerate(lines):
                  if line.startswith(
                      "Profits calculated to a"
                  ):
                      lines = lines[:i]
                      break

              results = []
              today = london_today()

              # OLBG football profile order:
              # Selection -> Fixture -> Market -> Today HH:MM
              for i, item in enumerate(lines):
                  fm = FIXTURE_RE.fullmatch(item)

                  if not fm or i == 0:
                      continue

                  clock_in_fixture, home, away = fm.groups()
                  selection = lines[i - 1]

                  if (
                      selection in MARKETS
                      or selection.startswith("Today Tips")
                      or selection.startswith("Tomorrow Tips")
                      or len(selection) > 100
                  ):
                      continue

                  following = lines[
                      i + 1:i + 5
                  ]

                  market = next(
                      (
                          x for x in following
                          if x in MARKETS
                      ),
                      None
                  )

                  if not market:
                      continue

                  day = None
                  clock = clock_in_fixture

                  for item2 in following:
                      tm = TIME_RE.fullmatch(item2)

                      if tm:
                          offset = (
                              1 if tm.group(1).lower()
                              == "tomorrow" else 0
                          )
                          day = (
                              today + timedelta(days=offset)
                          ).isoformat()
                          clock = tm.group(2)
                          break

                      if DATE_RE.fullmatch(item2):
                          day = datetime.strptime(
                              item2, "%d %B %Y"
                          ).date().isoformat()
                          break

                  if day is None:
                      raise RuntimeError(
                          "tipstonga match date unknown: "
                          + item
                      )

                  results.append(tip_record(
                      "tipstonga",
                      day, clock,
                      home, away,
                      market, selection
                  ))

              unique = {
                  x["id"]: x for x in results
              }

              print(
                  "tipstonga: recognized",
                  len(unique), "football tips"
              )

              # No fixtures: valid empty tip list.
              if not unique and any(
                  FIXTURE_RE.fullmatch(x)
                  for x in lines
              ):
                  raise RuntimeError(
                      "tipstonga fixtures not parsed"
                  )

              return list(unique.values())

          def translate(selection, market):
              s = selection.strip()

              if market in ("Full Time Result", "Result"):
                  if s.casefold() in ("draw", "x"):
                      return "Нічия"
                  return "Перемога: " + s

              if re.fullmatch(
                  r"Yes(?:\s*\(BTTS\))?",
                  s, re.I
              ) and market == "Both Teams to Score":
                  return "Так"

              if re.fullmatch(
                  r"No(?:\s*\(BTTS\))?",
                  s, re.I
              ) and market == "Both Teams to Score":
                  return "Ні"

              s = re.sub(
                  r"^Over\s+", "Більше ", s, flags=re.I
              )
              s = re.sub(
                  r"^Under\s+", "Менше ", s, flags=re.I
              )
              s = s.replace(
                  "(AH)", "(азійська фора)"
              )

              return re.sub(
                  r"(?<=\d)\.(?=\d)", ",", s
              )

          def send_telegram(message):
              token = os.getenv("BOT_TOKEN")
              chat = os.getenv("CHAT_ID")

              if not token or not chat:
                  raise RuntimeError(
                      "Missing Telegram secrets"
                  )

              url = (
                  "https://api.telegram.org/bot"
                  + token + "/sendMessage"
              )

              data = urllib.parse.urlencode({
                  "chat_id": chat,
                  "text": message,
                  "disable_notification": "false",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")

              with urllib.request.urlopen(
                  url, data=data, timeout=30
              ) as response:
                  result = json.load(response)

              if not result.get("ok"):
                  raise RuntimeError(
                      "Telegram did not confirm delivery"
                  )

          def save_state(state):
              STATE_PATH.parent.mkdir(
                  parents=True, exist_ok=True
              )

              STATE_PATH.write_text(
                  json.dumps(
                      state,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              subprocess.run([
                  "git", "add", str(STATE_PATH)
              ], check=True)

              diff = subprocess.run([
                  "git", "diff", "--cached", "--quiet"
              ])

              if diff.returncode == 0:
                  return

              subprocess.run([
                  "git", "-c",
                  "user.name=github-actions[bot]",
                  "-c",
                  "user.email=41898282+github-actions[bot]@users.noreply.github.com",
                  "commit", "-m",
                  "Update football alerts history"
              ], check=True)

              subprocess.run([
                  "git", "push",
                  "origin", "HEAD:main"
              ], check=True)

          if STATE_PATH.exists():
              state = json.loads(
                  STATE_PATH.read_text(
                      encoding="utf-8"
                  )
              )
          else:
              state = {
                  "seen": [],
                  "matches": {}
              }

          seen = set(state.get("seen", []))
          matches = state.get("matches", {})

          collected = []
          errors = []

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(
                  headless=True
              )

              try:
                  for author, url in SOURCES.items():
                      try:
                          print("Checking:", author)

                          text = extract_page(
                              browser, url
                          )

                          if author == "Geobetting":
                              tips = parse_geobetting(text)
                          else:
                              tips = parse_tipstonga(text)

                          collected.extend(tips)

                      except Exception as exc:
                          print(
                              "ERROR:", author, str(exc)
                          )
                          errors.append(author)
              finally:
                  browser.close()

          pending = [
              x for x in collected
              if x["id"] not in seen
          ]

          print("New tips:", len(pending))

          for tip in pending:
              previous = matches.get(
                  tip["match_key"], []
              )

              other = [
                  x for x in previous
                  if x["author"] != tip["author"]
              ]

              fixture = (
                  tip["home"] + " — " + tip["away"]
              )

              message = (
                  "⚽ НОВИЙ ПРОГНОЗ\n\n"
                  f"👤 Каппер: {tip['author']}\n"
                  f"🏟 Матч: {fixture}\n"
                  f"📅 Дата: {tip['date']}\n"
                  f"📊 Ринок: {MARKETS[tip['market']]}\n"
                  f"🎯 Ставка: "
                  f"{translate(tip['selection'], tip['market'])}\n"
              )

              if tip["time"]:
                  message += (
                      f"🕒 Час OLBG: {tip['time']}\n"
                  )

              if other:
                  message += (
                      "\n⚠️ ЗБІГ ПРОГНОЗІВ!\n"
                      "Обидва каппери обрали цей матч.\n"
                  )

                  for old in other:
                      message += (
                          f"• {old['author']}: "
                          f"{translate(old['selection'], old['market'])}\n"
                      )

                  message += (
                      "Врахуй сумарний ризик.\n"
                  )

              message += (
                  "\n📌 Коефіцієнт перевір у букмекера"
                  "\n🔗 " + tip["url"]
              )

              send_telegram(message)

              seen.add(tip["id"])

              matches.setdefault(
                  tip["match_key"], []
              ).append({
                  "author": tip["author"],
                  "market": tip["market"],
                  "selection": tip["selection"],
              })

              save_state({
                  "seen": sorted(seen),
                  "matches": matches,
              })

              print(
                  "Sent:",
                  tip["author"],
                  fixture,
                  tip["selection"]
              )

          if errors:
              raise RuntimeError(
                  "Failed sources: "
                  + ", ".join(errors)
              )

          print("Monitoring complete")
          PY
