
name: Football Tips Alerts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-tips-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Monitor OLBG and Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python3 -u - <<'PY'
          import hashlib, json, os, re, subprocess, time, unicodedata
          import urllib.request, urllib.parse, urllib.error
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          SOURCES = {
              'Geobetting': 'https://www.olbg.com/tipsters/tips/420769',
              'tipstonga': 'https://www.olbg.com/best-tipsters/Football/1/13000',
          }
          MARKETS = {
              'Full Time Result':'Результат матчу', 'Result':'Результат матчу',
              'Total Goals':'Тотал голів', 'Both Teams to Score':'Обидві заб’ють',
              'Asian Hcap':'Азійська фора', 'Result and BTTS':'Результат + ОЗ',
              'Total Corners':'Кутові', 'Total Cards':'Картки',
              'Correct Score':'Точний рахунок', 'Half Time Result':'Перший тайм',
              'Half Time/Full Time':'Тайм / матч', 'Anytime Goalscorer':'Автор гола',
              'First Goalscorer':'Перший гол',
          }
          STATE = Path('.state/football-tips.json')
          KYIV, LONDON = ZoneInfo('Europe/Kyiv'), ZoneInfo('Europe/London')
          FIXTURE = re.compile(r'^(?:(\d{1,2}:\d{2})\s+)?(.+?)\s+v\s+(.+)$', re.I)
          DATE = re.compile(r'^\d{1,2} [A-Za-z]+ 20\d{2}$')
          token = os.getenv('BOT_TOKEN', '').strip()
          chat_id = os.getenv('CHAT_ID', '').strip()
          if not token or not chat_id:
              raise RuntimeError('BOT_TOKEN / CHAT_ID are missing')
          state = json.loads(STATE.read_text(encoding='utf8')) if STATE.exists() else {}
          seen = set(state.get('seen', []))
          snaps = state.setdefault('snapshots', {})
          matches = state.setdefault('matches', {})
          now = lambda: datetime.now(KYIV)

          def api(method, params=None):
              url = 'https://api.telegram.org/bot' + token + '/' + method
              body = urllib.parse.urlencode(params or {}).encode()
              try:
                  with urllib.request.urlopen(url, data=body, timeout=30) as res:
                      result = json.load(res)
              except urllib.error.HTTPError as ex:
                  raise RuntimeError('Telegram ' + method + ' HTTP ' + str(ex.code)) from None
              if not result.get('ok'):
                  raise RuntimeError('Telegram ' + method + ' rejected')
              return result['result']

          MENU = [
              [('📊 Цей місяць','stats'), ('🏆 Разом','total')],
              [('📈 30 днів','compare'), ('📚 Архів','archive')],
              [('📅 3 місяці','last3'), ('📅 6 місяців','last6')],
              [('📅 12 місяців','last12'), ('♾ Увесь час','alltime')],
              [('⏳ Підтвердити ставки','pending:0'), ('❔ Допомога','help')],
          ]
          BACK = [[('⬅️ Головне меню','menu')]]
          def send(text, rows=None, edit=None):
              params = {'chat_id':chat_id,'text':text[:4096], 'disable_web_page_preview':'true'}
              if rows is not None:
                  params['reply_markup'] = json.dumps({'inline_keyboard':[
                      [{'text':label,'callback_data':value} for label,value in row]
                      for row in rows
                  ]}, ensure_ascii=False)
              if edit is not None:
                  params['message_id'] = edit
                  return api('editMessageText', params)
              return api('sendMessage', params)

          def save():
              state['seen'] = sorted(seen)
              STATE.parent.mkdir(parents=True, exist_ok=True)
              STATE.write_text(json.dumps(state, ensure_ascii=False, indent=2), encoding='utf8')
              subprocess.run(['git','add',str(STATE)], check=True)
              diff = subprocess.run(['git','diff','--cached','--quiet']).returncode
              if diff == 0: return
              if diff != 1: raise RuntimeError('git diff failed')
              subprocess.run(['git','-c','user.name=github-actions[bot]',
                              '-c','user.email=41898282+github-actions[bot]@users.noreply.github.com',
                              'commit','-m','Update football tips archive'], check=True)
              subprocess.run(['git','push','origin','HEAD:main'], check=True)

          def norm(s):
              s = ''.join(c for c in unicodedata.normalize('NFKD',s.casefold())
                          if not unicodedata.combining(c))
              s = re.sub(r'[^a-z0-9]+',' ',s).strip()
              aliases = {'roma':'as roma','man utd':'manchester united',
                         'man city':'manchester city','spurs':'tottenham hotspur',
                         'psg':'paris saint germain','barca':'barcelona'}
              return aliases.get(s,s)
          def tip(author,day,clock,home,away,market,choice):
              fixture = day+'|'+'|'.join(sorted([norm(home),norm(away)]))
              uid = hashlib.sha256('|'.join([author,fixture,market,choice.casefold().strip()]).encode()).hexdigest()
              return dict(id=uid,author=author,date=day,time=clock,home=home,away=away,
                          market=market,selection=choice,match_key=fixture,url=SOURCES[author],odds=None)

          def page_data(browser,author,url):
              for attempt in range(1,4):
                  page = browser.new_page(viewport={'width':1280,'height':900})
                  try:
                      res = page.goto(url, wait_until='domcontentloaded', timeout=45000)
                      if res and res.status >= 400: raise RuntimeError('HTTP '+str(res.status))
                      try: page.get_by_text('Accept all',exact=True).last.click(timeout=1800)
                      except Exception: pass
                      page.wait_for_timeout(3500 if attempt == 1 else 6500)
                      body = page.locator('body').inner_text(timeout=12000)
                      low = body.casefold()
                      valid = ("geobetting's tips" in low if author == 'Geobetting'
                               else ('tipstonga' in low and ('today tips' in low or 'no current tips' in low)))
                      print('Page:',author,'attempt:',attempt,'chars:',len(body),'valid:',valid)
                      if valid: return body,page.content()
                  except Exception as ex:
                      print('Page retry:',author,type(ex).__name__)
                  finally: page.close()
              return None,None

          def parse_geobetting(body):
              if 'geobetting has no current tips' in body.casefold(): return []
              lines = [s.strip() for s in body.splitlines() if s.strip()]
              start = next(i for i,s in enumerate(lines) if "geobetting's tips" in s.casefold())
              lines = lines[start+1:]
              stop = next((i for i,s in enumerate(lines) if 'Tips are normally settled' in s),len(lines))
              lines = lines[:stop]
              day=home=away=clock=None
              found=[]
              for i,s in enumerate(lines):
                  if DATE.fullmatch(s):
                      day=datetime.strptime(s,'%d %B %Y').date().isoformat()
                      home=away=clock=None
                  elif day and FIXTURE.fullmatch(s):
                      clock,home,away=FIXTURE.fullmatch(s).groups()
                  elif s in MARKETS and day and home and i:
                      choice=lines[i-1]
                      if choice not in MARKETS and len(choice)<120 and not FIXTURE.fullmatch(choice):
                          found.append(tip('Geobetting',day,clock,home,away,s,choice))
              if not found and any(DATE.fullmatch(s) for s in lines):
                  raise RuntimeError('Geobetting tips not parsed')
              return list({t['id']:t for t in found}.values())

          def parse_tipstonga(body):
              lines=[s.strip() for s in body.splitlines() if s.strip()]
              marker=next((i for i,s in enumerate(lines) if s.casefold()=='today tips'),None)
              if marker is None:
                  if 'no current tips' in body.casefold(): return []
                  raise RuntimeError('Today Tips section missing')
              lines=lines[marker+1:]
              stop=next((i for i,s in enumerate(lines) if s.startswith('Profits calculated to a')),len(lines))
              lines=lines[:stop]
              today=datetime.now(LONDON).date()
              found=[]; fixtures=0
              for i,s in enumerate(lines):
                  match=FIXTURE.fullmatch(s)
                  if not match or not i: continue
                  fixtures+=1
                  clock,home,away=match.groups()
                  choice=lines[i-1]
                  following=lines[i+1:i+9]
                  market=next((s for s in following if s in MARKETS),None)
                  if not market or choice in MARKETS: continue
                  day=None
                  for j,v in enumerate(following):
                      if v in ('Today','Tomorrow'):
                          day=(today+timedelta(days=int(v=='Tomorrow'))).isoformat()
                          if j+1<len(following) and re.fullmatch(r'\d{1,2}:\d{2}',following[j+1]):
                              clock=following[j+1]
                          break
                      if DATE.fullmatch(v):
                          day=datetime.strptime(v,'%d %B %Y').date().isoformat();break
                  if not day: continue
                  found.append(tip('tipstonga',day,clock,home,away,market,choice))
              result=list({t['id']:t for t in found}.values())
              if fixtures and len(result)!=fixtures: raise RuntimeError('tipstonga tips partially parsed')
              return result

          def odds_from_html(html,tips):
              soup=BeautifulSoup(html,'html.parser')
              for t in tips:
                  candidates=set()
                  for node in soup.select('span.ui-odds[data-decimal]'):
                      raw=node.get('data-decimal','')
                      if not re.fullmatch(r'\d+(?:\.\d+)?',raw): continue
                      for parent in node.parents:
                          if parent.name in ('body','html','[document]'):break
                          text=' '.join(parent.stripped_strings)
                          if len(text)>3500:break
                          if (t['home']+' v '+t['away']).casefold() in text.casefold():
                              if (t['selection'].casefold() in text.casefold()
                                  and t['market'].casefold() in text.casefold()
                                  and len(parent.select('span.ui-odds[data-decimal]'))==1):
                                  candidates.add(raw)
                              break
                  if len(candidates)==1:t['odds']=next(iter(candidates))
                  print('Tip:',t['author'],t['home'],'v',t['away'],'odds:',t['odds'])

          def first_seen(v):
              raw=v.get('first_seen_at')
              if not raw:return None
              try:
                  d=datetime.fromisoformat(raw)
                  return d.replace(tzinfo=KYIV) if d.tzinfo is None else d.astimezone(KYIV)
              except (TypeError,ValueError):return None
          def entries(start=None,end=None,author=None):
              out=[]
              for key,v in snaps.items():
                  d=first_seen(v)
                  if d is None or (start and d<start) or (end and d>=end):continue
                  if author and v.get('author')!=author:continue
                  out.append((key,v))
              return out
          def month_start(dt):return datetime(dt.year,dt.month,1,tzinfo=KYIV)
          def shift(dt,n):
              index=dt.year*12+dt.month-1+n
              return datetime(index//12,index%12+1,1,tzinfo=KYIV)
          def fmt(num,digits=2):return f'{num:+.{digits}f}'.replace('.',',')
          def stats(rows,label):
              items=[v for _,v in rows]
              wins=[v for v in items if v.get('result')=='win']
              losses=[v for v in items if v.get('result')=='loss']
              pushes=[v for v in items if v.get('result')=='push']
              settled=wins+losses+pushes
              pending=len(items)-len(settled)
              decided=len(wins)+len(losses)
              hit=f'{100*len(wins)/decided:.1f}%'.replace('.',',') if decided else 'н/д'
              all_odds=all(v.get('odds_first_seen') is not None for v in settled)
              if settled and all_odds:
                  profit=sum(float(v['odds_first_seen'])-1 for v in wins)-len(losses)
                  performance=fmt(profit)+' од. | ROI '+fmt(profit/len(settled)*100,1)+'%'
              else:performance='н/д | ROI н/д'
              known=sum(v.get('odds_first_seen') is not None for v in items)
              return (f'👤 {label}\n⚽ Прогнозів: {len(items)}\n'
                      f'✅ {len(wins)}  ❌ {len(losses)}  ↩️ {len(pushes)}  ⏳ {pending}\n'
                      f'🎯 Прохідність: {hit}\n💰 Прибуток: {performance}\n'
                      f'🔎 Коефіцієнти: {known}/{len(items)}')
          def report(start,end,label,combined=False):
              rows=entries(start,end)
              title='📊 FOOTBALL TIPS — '+label+'\n━━━━━━━━━━━━━\n\n'
              if combined:return title+stats(rows,'Обидва разом')
              return (title+stats(entries(start,end,'Geobetting'),'Geobetting')+'\n\n'
                      +stats(entries(start,end,'tipstonga'),'tipstonga')+'\n\n'
                      +stats(rows,'🏆 ОБИДВА РАЗОМ')
                      +'\n\nℹ️ ROI: однакова ставка 1 од. на кожен завершений прогноз з відомим кф.')

          def pending_view(page):
              rows=sorted([(k,v) for k,v in entries() if v.get('result') not in ('win','loss','push')],
                          key=lambda kv:first_seen(kv[1]),reverse=True)
              count=len(rows); limit=4; maxpage=max(0,(count-1)//limit)
              page=max(0,min(page,maxpage)); section=rows[page*limit:(page+1)*limit]
              text=f'⏳ ПРОГНОЗИ БЕЗ РЕЗУЛЬТАТУ: {count}\nСторінка {page+1}/{maxpage+1}\n'
              buttons=[]
              for k,v in section:
                  text+='\n⚽ '+str(v.get('fixture'))+'\n👤 '+str(v.get('author'))+'\n🎯 '+str(v.get('selection'))+'\n'
                  buttons.append([('✅ Виграш','r:w:'+k[:16]),('❌ Програш','r:l:'+k[:16]),('↩️ Повернення','r:p:'+k[:16])])
              nav=[]
              if page:nav.append(('⬅️',f'pending:{page-1}'))
              if page<maxpage:nav.append(('Далі ➡️',f'pending:{page+1}'))
              if nav:buttons.append(nav)
              return text,buttons+BACK

          def view(key):
              dt=now(); start=month_start(dt); end=shift(start,1)
              if key in ('start','menu'):
                  return '⚽ FOOTBALL TIPS ALERTS\n\nОбери розділ:',MENU
              if key=='help':
                  return ('❔ Допомога\nНатискай кнопки.\n'
                          '/month 2026-10 — потрібний місяць\n'
                          '/stats, /total, /history, /last3, /last6, /last12, /alltime\n'
                          '⏱ Відповідь під час наступного запуску GitHub Actions.'),BACK
              if key=='stats':return report(start,end,dt.strftime('%m.%Y')),BACK
              if key=='total':return report(start,end,dt.strftime('%m.%Y'),True),BACK
              if key=='compare':return report(dt-timedelta(days=30),dt,'ОСТАННІ 30 ДНІВ'),BACK
              if key in ('last3','last6','last12'):
                  months=int(key[4:])
                  return report(shift(start,1-months),dt,f'ОСТАННІ {months} МІСЯЦІВ'),BACK
              if key=='alltime':return report(None,None,'ЗА ВЕСЬ ЧАС'),BACK
              if key.startswith('pending'):
                  page=int(key.split(':')[1]) if ':' in key and key.split(':')[1].isdigit() else 0
                  return pending_view(page)
              periods=sorted({d.strftime('%Y-%m') for v in snaps.values() if (d:=first_seen(v))},reverse=True)
              if key in ('history','archive'):
                  buttons=[[('📅 '+p,'m:'+p)] for p in periods[:24]]+BACK
                  return ('📚 АРХІВ МІСЯЦІВ\n'+'\n'.join(periods[:24])
                          if periods else '📚 Архів поки порожній.'),buttons
              if re.fullmatch(r'm:20\d{2}-(0[1-9]|1[0-2])',key):
                  year,month=map(int,key[2:].split('-'))
                  s=datetime(year,month,1,tzinfo=KYIV)
                  return report(s,shift(s,1),key[2:]),[[('⬅️ Архів','archive')]]
              return 'Невідома команда. Відкрий /menu',BACK

          def process_updates():
              updates=api('getUpdates',{'offset':int(state.get('telegram_update_id',0)),
                                         'limit':100,'timeout':0})
              for upd in updates:
                  callback=upd.get('callback_query')
                  message=(callback.get('message') or {}) if callback else (upd.get('message') or {})
                  if str((message.get('chat') or {}).get('id'))!=chat_id:
                      state['telegram_update_id']=upd['update_id']+1;save();continue
                  try:
                      if callback:
                          key=callback.get('data','menu')
                          try:api('answerCallbackQuery',{'callback_query_id':callback['id']})
                          except Exception:pass
                          if key.startswith('r:'):
                              parts=key.split(':',2)
                              if len(parts)==3 and parts[1] in ('w','l','p'):
                                  ids=[k for k in snaps if k.startswith(parts[2])]
                                  if len(ids)==1:
                                      obj=snaps[ids[0]]
                                      if obj.get('result') in (None,'pending'):
                                          obj['result']={'w':'win','l':'loss','p':'push'}[parts[1]]
                                          obj['settled_at']=now().isoformat(timespec='seconds')
                                          save()
                                          send('✅ Результат збережено: '+str(obj.get('fixture')),[[('⏳ Інші прогнози','pending:0')]]+BACK)
                                          continue
                              send('Цей результат уже збережений або запис не знайдено.',BACK)
                          else:
                              output,buttons=view(key)
                              try:send(output,buttons,edit=message['message_id'])
                              except Exception:send(output,buttons)
                      else:
                          text=(message.get('text') or '').strip()
                          if not text.startswith('/'):continue
                          parts=text.split()
                          cmd=parts[0].split('@')[0].lower().lstrip('/')
                          if cmd=='month' and len(parts)==2:cmd='m:'+parts[1]
                          if cmd in ('start','menu'):cmd='menu'
                          output,buttons=view(cmd)
                          send(output,buttons)
                  finally:
                      state['telegram_update_id']=upd['update_id']+1
                      save()
              print('Telegram updates:',len(updates))

          commands=[('menu','Кнопкове меню'),('stats','Статистика місяця'),
                    ('total','Обидва каппери разом'),('history','Архів місяців'),
                    ('pending','Підтвердити результати'),('alltime','За весь час')]
          try:api('setMyCommands',{'commands':json.dumps([
              {'command':c,'description':d} for c,d in commands],ensure_ascii=False)})
          except Exception as ex:print('Telegram menu warning:',type(ex).__name__)
          process_updates()

          current=now()
          if current.day==1:
              previous=shift(month_start(current),-1)
              period=previous.strftime('%Y-%m')
              if state.get('last_monthly_report')!=period:
                  send(report(previous,month_start(current),'ПІДСУМКИ '+period),MENU)
                  state['last_monthly_report']=period
                  save()

          all_tips=[]; errors=[]
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              try:
                  for author,url in SOURCES.items():
                      body,html=page_data(browser,author,url)
                      if body is None:
                          print('WARNING: skipped incomplete page for',author)
                          errors.append(author)
                          continue
                      try:
                          found=parse_geobetting(body) if author=='Geobetting' else parse_tipstonga(body)
                          odds_from_html(html,found)
                          all_tips.extend(found)
                          print('Found',len(found),'tips for',author)
                      except Exception as ex:
                          print('WARNING: parser error:',author,str(ex))
                          errors.append(author)
              finally:browser.close()

          by_match={}
          for t in all_tips:by_match.setdefault(t['match_key'],[]).append(t)
          new=0; restored=0
          for t in all_tips:
              if t['id'] not in snaps:
                  snaps[t['id']]={'author':t['author'],'fixture':t['home']+' v '+t['away'],
                                  'date':t['date'],'selection':t['selection'],'market':t['market'],
                                  'odds_first_seen':t['odds'],'first_seen_at':now().isoformat(timespec='seconds'),
                                  'source':t['url'],'result':'pending',
                                  'recovered':t['id'] in seen}
                  if t['id'] in seen:restored+=1
              if t['id'] in seen:continue
              msg=('⚽ НОВИЙ ПРОГНОЗ\n━━━━━━━━━━━━━\n'
                   f'👤 {t["author"]}\n🏟 {t["home"]} — {t["away"]}\n'
                   f'📅 {t["date"]}\n📊 {MARKETS[t["market"]]}\n'
                   f'🎯 {t["selection"]}\n💰 OLBG: {t["odds"] or "н/д"}\n'
                   f'🕘 Виявлено: {now().strftime("%d.%m.%Y %H:%M")} (Київ)\n')
              if t['time']:msg+='🕒 Час OLBG: '+t['time']+'\n'
              others=[a for a in by_match.get(t['match_key'],[]) if a['author']!=t['author']]
              if others:
                  msg+='\n⚠️ ІНШИЙ КАППЕР НА ЦЕЙ МАТЧ:\n'
                  for other in others:msg+=f'• {other["author"]}: {other["selection"]}\n'
              msg+='\n🔗 '+t['url']
              send(msg,[[('📊 Статистика','stats'),('🏠 Меню','menu')]])
              seen.add(t['id'])
              old=matches.setdefault(t['match_key'],[])
              if not any(x.get('author',x.get('tipster'))==t['author'] and
                         x.get('market')==t['market'] and x.get('selection')==t['selection'] for x in old):
                  old.append({'author':t['author'],'market':t['market'],'selection':t['selection']})
              save();new+=1
          save()
          print('New tips:',new,'Recovered:',restored,'Unavailable sources:',','.join(errors) or 'none')
          print('Monitoring complete')
          PY
