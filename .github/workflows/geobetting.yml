
name: Football Tips Alerts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-tips-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser
        run: |
          pip install beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Monitor tips, results and Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python3 -u - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import unicodedata
          import urllib.parse
          import urllib.request

          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          SOURCES = {
              'Geobetting':
                  'https://www.olbg.com/tipsters/tips/420769',
              'tipstonga':
                  'https://www.olbg.com/best-tipsters/Football/1/13000',
          }

          MARKETS = {
              'Full Time Result': 'Результат матчу',
              'Result': 'Результат матчу',
              'Total Goals': 'Тотал голів',
              'Both Teams to Score': 'Обидві заб’ють',
              'Asian Hcap': 'Азійська фора',
              'Result and BTTS': 'Результат + ОЗ',
              'Total Corners': 'Кутові',
              'Total Cards': 'Картки',
              'Correct Score': 'Точний рахунок',
              'Half Time Result': 'Перший тайм',
              'Half Time/Full Time': 'Тайм / матч',
              'Anytime Goalscorer': 'Автор гола',
              'First Goalscorer': 'Перший гол',
          }

          ALIASES = {
              'roma': 'as roma',
              'man utd': 'manchester united',
              'man united': 'manchester united',
              'man city': 'manchester city',
              'spurs': 'tottenham hotspur',
              'tottenham': 'tottenham hotspur',
              'psg': 'paris saint germain',
              'barca': 'barcelona',
              'fc barcelona': 'barcelona',
              'inter milan': 'internazionale',
              'ac milan': 'milan',
              'bayern': 'bayern munich',
              'como 1907': 'como',
              'torino fc': 'torino',
          }

          FIXTURE = re.compile(
              r'^(?:(\d{1,2}:\d{2})\s+)?'
              r'(.+?)\s+v\s+(.+)$',
              re.I
          )

          DATE = re.compile(
              r'^\d{1,2} [A-Za-z]+ 20\d{2}$'
          )

          KYIV = ZoneInfo('Europe/Kyiv')
          LONDON = ZoneInfo('Europe/London')

          STATE = Path('.state/football-tips.json')

          TOKEN = os.getenv('BOT_TOKEN', '').strip()
          CHAT = os.getenv('CHAT_ID', '').strip()

          if not TOKEN or not CHAT:
              raise RuntimeError(
                  'BOT_TOKEN and CHAT_ID are required'
              )

          if STATE.exists():
              state = json.loads(
                  STATE.read_text(encoding='utf-8')
              )
          else:
              state = {}

          seen = set(state.get('seen', []))
          snaps = state.setdefault('snapshots', {})
          matches = state.setdefault('matches', {})

          def now():
              return datetime.now(KYIV)

          def request_json(url, params=None, post=False):
              data = (
                  urllib.parse.urlencode(
                      params or {}
                  ).encode()
                  if post else None
              )

              request = urllib.request.Request(
                  url,
                  data=data,
                  headers={
                      'User-Agent':
                          'Mozilla/5.0 FootballTipsMonitor/1.0'
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=22
              ) as response:
                  return json.load(response)

          def telegram(method, params=None):
              result = request_json(
                  'https://api.telegram.org/bot'
                  + TOKEN + '/' + method,
                  params,
                  True
              )

              if not result.get('ok'):
                  raise RuntimeError(
                      'Telegram error: ' + method
                  )

              return result['result']

          MENU = [
              [
                  ('📊 Цей місяць', 'stats'),
                  ('🏆 Разом', 'total'),
              ],
              [
                  ('📈 30 днів', 'compare'),
                  ('📚 Архів', 'archive'),
              ],
              [
                  ('📅 3 місяці', 'last3'),
                  ('📅 6 місяців', 'last6'),
              ],
              [
                  ('📅 12 місяців', 'last12'),
                  ('♾ Весь час', 'alltime'),
              ],
              [
                  ('⏳ Очікують', 'pending'),
                  ('❔ Допомога', 'help'),
              ],
          ]

          BACK = [
              [('⬅️ Меню', 'menu')]
          ]

          def send(text, buttons=None, edit=None):
              data = {
                  'chat_id': CHAT,
                  'text': text[:4096],
                  'disable_web_page_preview': 'true',
              }

              if buttons is not None:
                  data['reply_markup'] = json.dumps(
                      {
                          'inline_keyboard': [
                              [
                                  {
                                      'text': name,
                                      'callback_data': key
                                  }
                                  for name, key in row
                              ]
                              for row in buttons
                          ]
                      },
                      ensure_ascii=False
                  )

              if edit is not None:
                  data['message_id'] = edit

                  return telegram(
                      'editMessageText',
                      data
                  )

              return telegram('sendMessage', data)

          def save():
              state['seen'] = sorted(seen)

              STATE.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              STATE.write_text(
                  json.dumps(
                      state,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding='utf-8'
              )

              subprocess.run(
                  ['git', 'add', str(STATE)],
                  check=True
              )

              status = subprocess.run(
                  [
                      'git',
                      'diff',
                      '--cached',
                      '--quiet'
                  ]
              ).returncode

              if status == 0:
                  return

              if status != 1:
                  raise RuntimeError('git diff failed')

              subprocess.run([
                  'git',
                  '-c',
                  'user.name=github-actions[bot]',
                  '-c',
                  'user.email=41898282+github-actions[bot]@users.noreply.github.com',
                  'commit',
                  '-m',
                  'Update football tips archive',
              ], check=True)

              subprocess.run([
                  'git',
                  'push',
                  'origin',
                  'HEAD:main',
              ], check=True)

          def norm(value):
              value = ''.join(
                  c for c in unicodedata.normalize(
                      'NFKD',
                      str(value).casefold()
                  )
                  if not unicodedata.combining(c)
              )

              value = re.sub(
                  r'[^a-z0-9]+',
                  ' ',
                  value
              ).strip()

              return ALIASES.get(value, value)

          def tip(
              author,
              day,
              clock,
              home,
              away,
              market,
              choice
          ):
              match = (
                  day + '|'
                  + '|'.join(
                      sorted([
                          norm(home),
                          norm(away)
                      ])
                  )
              )

              raw = '|'.join([
                  author,
                  match,
                  market,
                  choice.casefold().strip()
              ])

              uid = hashlib.sha256(
                  raw.encode()
              ).hexdigest()

              return {
                  'id': uid,
                  'author': author,
                  'date': day,
                  'time': clock,
                  'home': home,
                  'away': away,
                  'market': market,
                  'selection': choice,
                  'match_key': match,
                  'url': SOURCES[author],
                  'odds': None,
              }

          def parse_geobetting(body):
              if (
                  'geobetting has no current tips'
                  in body.casefold()
              ):
                  return []

              lines = [
                  x.strip()
                  for x in body.splitlines()
                  if x.strip()
              ]

              start = next(
                  i for i, x in enumerate(lines)
                  if "geobetting's tips"
                  in x.casefold()
              )

              lines = lines[start + 1:]

              stop = next(
                  (
                      i for i, x in enumerate(lines)
                      if 'tips are normally settled'
                      in x.casefold()
                  ),
                  len(lines)
              )

              lines = lines[:stop]

              day = home = away = clock = None
              found = []

              for i, line in enumerate(lines):
                  if DATE.fullmatch(line):
                      day = datetime.strptime(
                          line,
                          '%d %B %Y'
                      ).date().isoformat()

                      home = away = clock = None

                  elif day and FIXTURE.fullmatch(line):
                      clock, home, away = (
                          FIXTURE.fullmatch(line).groups()
                      )

                  elif line in MARKETS and day and home and i:
                      choice = lines[i - 1]

                      if (
                          choice not in MARKETS
                          and choice not in (
                              '@',
                              'WIN',
                              '50 WIN'
                          )
                          and len(choice) < 120
                          and not FIXTURE.fullmatch(choice)
                      ):
                          found.append(
                              tip(
                                  'Geobetting',
                                  day,
                                  clock,
                                  home,
                                  away,
                                  line,
                                  choice
                              )
                          )

              if (
                  not found
                  and any(
                      DATE.fullmatch(x)
                      for x in lines
                  )
              ):
                  raise ValueError(
                      'Active tips were not parsed'
                  )

              return list({
                  x['id']: x
                  for x in found
              }.values())

          def parse_tipstonga(body):
              lines = [
                  x.strip()
                  for x in body.splitlines()
                  if x.strip()
              ]

              marker = next(
                  (
                      i for i, x in enumerate(lines)
                      if x.casefold() == 'today tips'
                  ),
                  None
              )

              if marker is None:
                  raise ValueError(
                      'Today Tips section absent'
                  )

              lines = lines[marker + 1:]

              stop = next(
                  (
                      i for i, x in enumerate(lines)
                      if x.startswith(
                          'Profits calculated to a'
                      )
                  ),
                  len(lines)
              )

              lines = lines[:stop]

              today = datetime.now(LONDON).date()

              found = []
              fixtures = 0

              for i, line in enumerate(lines):
                  m = FIXTURE.fullmatch(line)

                  if not m or i == 0:
                      continue

                  fixtures += 1

                  clock, home, away = m.groups()
                  choice = lines[i - 1]

                  following = lines[i + 1:i + 9]

                  market = next(
                      (
                          x for x in following
                          if x in MARKETS
                      ),
                      None
                  )

                  if (
                      not market
                      or choice in MARKETS
                      or choice in (
                          'SELECTION',
                          'WIN',
                          'ODDS',
                          'VALUE RATING'
                      )
                  ):
                      continue

                  day = None

                  for j, val in enumerate(following):
                      if val in (
                          'Today',
                          'Tomorrow'
                      ):
                          day = (
                              today + timedelta(
                                  days=int(
                                      val == 'Tomorrow'
                                  )
                              )
                          ).isoformat()

                          if (
                              j + 1 < len(following)
                              and re.fullmatch(
                                  r'\d{1,2}:\d{2}',
                                  following[j + 1]
                              )
                          ):
                              clock = following[j + 1]

                          break

                      if DATE.fullmatch(val):
                          day = datetime.strptime(
                              val,
                              '%d %B %Y'
                          ).date().isoformat()

                          break

                  if day:
                      found.append(
                          tip(
                              'tipstonga',
                              day,
                              clock,
                              home,
                              away,
                              market,
                              choice
                          )
                      )

              unique = list({
                  x['id']: x
                  for x in found
              }.values())

              if fixtures != len(unique):
                  raise ValueError(
                      'Partial tipstonga parsing'
                  )

              return unique

          def add_odds(html, tips):
              soup = BeautifulSoup(
                  html,
                  'html.parser'
              )

              for t in tips:
                  values = set()

                  for node in soup.select(
                      'span.ui-odds[data-decimal]'
                  ):
                      raw = node.get(
                          'data-decimal',
                          ''
                      )

                      if not re.fullmatch(
                          r'\d+(?:\.\d+)?',
                          raw
                      ):
                          continue

                      if not 1.01 <= float(raw) <= 1000:
                          continue

                      for parent in node.parents:
                          if parent.name in (
                              'body',
                              'html',
                              '[document]'
                          ):
                              break

                          text = ' '.join(
                              parent.stripped_strings
                          )

                          if len(text) > 3500:
                              break

                          phrase = (
                              t['home']
                              + ' v '
                              + t['away']
                          )

                          if (
                              phrase.casefold()
                              in text.casefold()
                          ):
                              if (
                                  t['selection'].casefold()
                                  in text.casefold()
                                  and t['market'].casefold()
                                  in text.casefold()
                                  and len(
                                      parent.select(
                                          'span.ui-odds[data-decimal]'
                                      )
                                  ) == 1
                              ):
                                  values.add(raw)

                              break

                  if len(values) == 1:
                      t['odds'] = next(iter(values))

                  print(
                      'ODDS',
                      t['author'],
                      t['home'],
                      'v',
                      t['away'],
                      t['odds']
                  )

          def load_page(browser, author, url):
              for attempt in range(1, 4):
                  page = browser.new_page(
                      viewport={
                          'width': 1280,
                          'height': 900
                      }
                  )

                  try:
                      response = page.goto(
                          url,
                          wait_until='domcontentloaded',
                          timeout=40000
                      )

                      if (
                          response
                          and response.status >= 400
                      ):
                          raise ValueError(
                              'HTTP '
                              + str(response.status)
                          )

                      try:
                          page.get_by_text(
                              'Accept all',
                              exact=True
                          ).last.click(timeout=1300)
                      except Exception:
                          pass

                      page.wait_for_timeout(
                          4000 if attempt == 1 else 6500
                      )

                      body = page.locator(
                          'body'
                      ).inner_text(timeout=12000)

                      if author == 'Geobetting':
                          valid = (
                              "geobetting's tips"
                              in body.casefold()
                          )
                      else:
                          valid = (
                              'today tips' in body.casefold()
                              and 'tipstonga'
                              in body.casefold()
                          )

                      print(
                          'PAGE',
                          author,
                          attempt,
                          'characters',
                          len(body),
                          'valid',
                          valid
                      )

                      if valid:
                          return body, page.content()

                  except Exception as exc:
                      print(
                          'PAGE WARNING',
                          author,
                          type(exc).__name__,
                          str(exc)[:140]
                      )

                  finally:
                      page.close()

              return None, None

          def first_seen(item):
              try:
                  value = datetime.fromisoformat(
                      item['first_seen_at']
                  )

                  if value.tzinfo is None:
                      return value.replace(
                          tzinfo=KYIV
                      )

                  return value.astimezone(KYIV)

              except (
                  KeyError,
                  ValueError,
                  TypeError
              ):
                  return None

          def entries(
              start=None,
              end=None,
              author=None
          ):
              rows = []

              for key, item in snaps.items():
                  dt = first_seen(item)

                  if (
                      dt is None
                      or (start and dt < start)
                      or (end and dt >= end)
                  ):
                      continue

                  if (
                      author
                      and item.get('author') != author
                  ):
                      continue

                  rows.append((key, item))

              return rows

          def month_start(dt):
              return datetime(
                  dt.year,
                  dt.month,
                  1,
                  tzinfo=KYIV
              )

          def shift(dt, n):
              index = (
                  dt.year * 12
                  + dt.month - 1 + n
              )

              return datetime(
                  index // 12,
                  index % 12 + 1,
                  1,
                  tzinfo=KYIV
              )

          def fmt(value, decimals=2):
              return (
                  f'{value:+.{decimals}f}'
              ).replace('.', ',')

          def summary(rows, label):
              items = [
                  v for _, v in rows
              ]

              wins = [
                  v for v in items
                  if v.get('result') == 'win'
              ]

              losses = [
                  v for v in items
                  if v.get('result') == 'loss'
              ]

              pushes = [
                  v for v in items
                  if v.get('result') == 'push'
              ]

              halfwins = [
                  v for v in items
                  if v.get('result') == 'half_win'
              ]

              halflosses = [
                  v for v in items
                  if v.get('result') == 'half_loss'
              ]

              settled = (
                  wins
                  + losses
                  + pushes
                  + halfwins
                  + halflosses
              )

              pending = len(items) - len(settled)

              known = sum(
                  v.get('odds_first_seen') is not None
                  for v in items
              )

              decided = len(wins) + len(losses)

              if decided:
                  hit = (
                      f'{100 * len(wins) / decided:.1f}%'
                  ).replace('.', ',')
              else:
                  hit = 'н/д'

              valid = (
                  bool(settled)
                  and all(
                      v.get('odds_first_seen') is not None
                      for v in settled
                  )
              )

              if valid:
                  net = (
                      sum(
                          float(v['odds_first_seen']) - 1
                          for v in wins
                      )
                      + sum(
                          (
                              float(
                                  v['odds_first_seen']
                              ) - 1
                          ) / 2
                          for v in halfwins
                      )
                      - len(losses)
                      - 0.5 * len(halflosses)
                  )

                  performance = (
                      fmt(net)
                      + ' од. | ROI '
                      + fmt(
                          100 * net / len(settled),
                          1
                      )
                      + '%'
                  )
              else:
                  performance = 'н/д | ROI н/д'

              return (
                  f'👤 {label}\n'
                  f'⚽ Прогнозів: {len(items)}\n'
                  f'✅ {len(wins)}  '
                  f'❌ {len(losses)}  '
                  f'↩️ {len(pushes)}  '
                  f'⏳ {pending}\n'
                  f'◐ Піввиграшів: {len(halfwins)}  '
                  f'Півпрограшів: {len(halflosses)}\n'
                  f'🎯 Прохідність: {hit}\n'
                  f'💰 Прибуток: {performance}\n'
                  f'🔎 Коефіцієнти: '
                  f'{known}/{len(items)}'
              )

          def report(
              start,
              end,
              label,
              combined=False
          ):
              title = (
                  '📊 FOOTBALL TIPS — '
                  + label
                  + '\n━━━━━━━━━━━━━\n\n'
              )

              rows = entries(start, end)

              if combined:
                  return (
                      title
                      + summary(
                          rows,
                          'Обидва разом'
                      )
                  )

              return (
                  title
                  + summary(
                      entries(
                          start,
                          end,
                          'Geobetting'
                      ),
                      'Geobetting'
                  )
                  + '\n\n'
                  + summary(
                      entries(
                          start,
                          end,
                          'tipstonga'
                      ),
                      'tipstonga'
                  )
                  + '\n\n'
                  + summary(
                      rows,
                      '🏆 ОБИДВА РАЗОМ'
                  )
                  + '\n\nℹ️ Розрахунок: '
                  '1 одиниця на кожен '
                  'підтверджений прогноз.'
              )

          def pending_view():
              rows = [
                  (k, v)
                  for k, v in entries()
                  if (
                      v.get('result', 'pending')
                      == 'pending'
                  )
              ]

              rows.sort(
                  key=lambda kv: first_seen(kv[1]),
                  reverse=True
              )

              msg = (
                  '⏳ НЕПІДТВЕРДЖЕНІ ПРОГНОЗИ: '
                  + str(len(rows))
              )

              for _, v in rows[:12]:
                  msg += (
                      '\n\n⚽ '
                      + str(v.get('fixture'))
                      + '\n👤 '
                      + str(v.get('author'))
                      + '\n🎯 '
                      + str(v.get('selection'))
                      + '\n📅 '
                      + str(v.get('date'))
                  )

              if not rows:
                  msg += (
                      '\nУсі збережені прогнози '
                      'вже розраховані.'
                  )

              return msg, BACK

          def view(key):
              dt = now()
              start = month_start(dt)

              if key in ('start', 'menu'):
                  return (
                      '⚽ FOOTBALL TIPS ALERTS\n\n'
                      'Обери розділ:',
                      MENU
                  )

              if key == 'help':
                  return (
                      '❔ Статистика оновлюється '
                      'автоматично після підтвердженого '
                      'результату.\n\n'
                      'Невизначені ринки залишаються '
                      'в очікуванні.\n\n'
                      'Кнопки обробляються під час '
                      'наступного запуску GitHub Actions.',
                      BACK
                  )

              if key == 'stats':
                  return (
                      report(
                          start,
                          shift(start, 1),
                          dt.strftime('%m.%Y')
                      ),
                      BACK
                  )

              if key == 'total':
                  return (
                      report(
                          start,
                          shift(start, 1),
                          dt.strftime('%m.%Y'),
                          True
                      ),
                      BACK
                  )

              if key == 'compare':
                  return (
                      report(
                          dt - timedelta(days=30),
                          dt,
                          'ОСТАННІ 30 ДНІВ'
                      ),
                      BACK
                  )

              if key in (
                  'last3',
                  'last6',
                  'last12'
              ):
                  n = int(key[4:])

                  return (
                      report(
                          shift(start, 1 - n),
                          dt,
                          f'ОСТАННІ {n} МІСЯЦІВ'
                      ),
                      BACK
                  )

              if key == 'alltime':
                  return (
                      report(
                          None,
                          None,
                          'ЗА ВЕСЬ ЧАС'
                      ),
                      BACK
                  )

              if key == 'pending':
                  return pending_view()

              if key in ('archive', 'history'):
                  periods = sorted({
                      d.strftime('%Y-%m')
                      for v in snaps.values()
                      if (d := first_seen(v))
                  }, reverse=True)

                  buttons = [
                      [('📅 ' + p, 'm:' + p)]
                      for p in periods[:24]
                  ] + BACK

                  if periods:
                      title = (
                          '📚 АРХІВ МІСЯЦІВ\n'
                          + '\n'.join(periods[:24])
                      )
                  else:
                      title = '📚 Архів поки порожній.'

                  return title, buttons

              if re.fullmatch(
                  r'm:20\d{2}-(0[1-9]|1[0-2])',
                  key
              ):
                  y, m = map(
                      int,
                      key[2:].split('-')
                  )

                  s = datetime(
                      y,
                      m,
                      1,
                      tzinfo=KYIV
                  )

                  return (
                      report(
                          s,
                          shift(s, 1),
                          key[2:]
                      ),
                      [
                          [('⬅️ Архів', 'archive')]
                      ]
                  )

              return (
                  'Невідома команда. Натисни /menu',
                  BACK
              )

          def process_commands():
              updates = telegram(
                  'getUpdates',
                  {
                      'offset': int(
                          state.get(
                              'telegram_update_id',
                              0
                          )
                      ),
                      'limit': 100,
                      'timeout': 0
                  }
              )

              for update in updates:
                  callback = update.get(
                      'callback_query'
                  )

                  if callback:
                      msg = (
                          callback.get('message') or {}
                      )
                  else:
                      msg = (
                          update.get('message') or {}
                      )

                  actual_chat = str(
                      (
                          msg.get('chat') or {}
                      ).get('id')
                  )

                  if actual_chat != CHAT:
                      state['telegram_update_id'] = (
                          update['update_id'] + 1
                      )

                      save()
                      continue

                  try:
                      if callback:
                          try:
                              telegram(
                                  'answerCallbackQuery',
                                  {
                                      'callback_query_id':
                                          callback['id']
                                  }
                              )
                          except Exception:
                              pass

                          text, buttons = view(
                              callback.get(
                                  'data',
                                  'menu'
                              )
                          )

                          try:
                              send(
                                  text,
                                  buttons,
                                  edit=msg['message_id']
                              )
                          except Exception:
                              send(
                                  text,
                                  buttons
                              )

                      else:
                          text = (
                              msg.get('text') or ''
                          ).strip()

                          if not text.startswith('/'):
                              continue

                          parts = text.split()

                          command = (
                              parts[0]
                              .split('@')[0]
                              .lower()
                              .lstrip('/')
                          )

                          if (
                              command == 'month'
                              and len(parts) == 2
                          ):
                              command = (
                                  'm:' + parts[1]
                              )

                          content, buttons = view(
                              command
                          )

                          send(
                              content,
                              buttons
                          )

                  finally:
                      state['telegram_update_id'] = (
                          update['update_id'] + 1
                      )

                      save()

              print(
                  'Telegram updates:',
                  len(updates)
              )

          def settled_from_score(
              item,
              home,
              away
          ):
              market = item.get(
                  'market',
                  ''
              )

              selection = str(
                  item.get('selection', '')
              ).strip()

              s = selection.casefold()
              total = home + away

              if market in (
                  'Result',
                  'Full Time Result'
              ):
                  if s in (
                      'draw',
                      'x',
                      'tie'
                  ):
                      return (
                          'win'
                          if home == away
                          else 'loss'
                      )

                  fixture = item.get(
                      'fixture',
                      ''
                  )

                  halves = re.split(
                      r'\s+v\s+',
                      fixture,
                      maxsplit=1,
                      flags=re.I
                  )

                  if len(halves) != 2:
                      return None

                  if (
                      norm(selection)
                      == norm(halves[0])
                  ):
                      return (
                          'win'
                          if home > away
                          else 'loss'
                      )

                  if (
                      norm(selection)
                      == norm(halves[1])
                  ):
                      return (
                          'win'
                          if away > home
                          else 'loss'
                      )

                  return None

              if market == 'Both Teams to Score':
                  if (
                      s in (
                          'yes',
                          'yes (btts)',
                          'both teams to score - yes'
                      )
                      or s.startswith('yes ')
                  ):
                      return (
                          'win'
                          if home > 0 and away > 0
                          else 'loss'
                      )

                  if (
                      s == 'no'
                      or s.startswith('no ')
                  ):
                      return (
                          'loss'
                          if home > 0 and away > 0
                          else 'win'
                      )

                  return None

              if market == 'Total Goals':
                  m = re.fullmatch(
                      r'(over|under)\s+'
                      r'(\d+(?:[.,]\d+)?)'
                      r'\s*(?:goals)?',
                      s
                  )

                  if not m:
                      return None

                  line = float(
                      m.group(2).replace(',', '.')
                  )

                  if m.group(1) == 'over':
                      if total > line:
                          return 'win'

                      if total == line:
                          return 'push'

                      return 'loss'

                  if total < line:
                      return 'win'

                  if total == line:
                      return 'push'

                  return 'loss'

              if market == 'Correct Score':
                  m = re.fullmatch(
                      r'(\d+)\s*[-:]\s*(\d+)',
                      s
                  )

                  if m:
                      expected = (
                          int(m.group(1)),
                          int(m.group(2))
                      )

                      return (
                          'win'
                          if (home, away) == expected
                          else 'loss'
                      )

              return None

          def fetch_result(item):
              fixture = item.get(
                  'fixture',
                  ''
              )

              teams = re.split(
                  r'\s+v\s+',
                  fixture,
                  maxsplit=1,
                  flags=re.I
              )

              if len(teams) != 2:
                  return None

              day = item.get('date')

              if not re.fullmatch(
                  r'20\d{2}-\d{2}-\d{2}',
                  str(day)
              ):
                  return None

              event_name = (
                  teams[0]
                  + '_vs_'
                  + teams[1]
              )

              params = urllib.parse.urlencode({
                  'e': event_name,
                  'd': day
              })

              url = (
                  'https://www.thesportsdb.com/api/v1/'
                  'json/123/searchevents.php?'
                  + params
              )

              data = request_json(url)

              events = (
                  data.get('event')
                  or data.get('events')
                  or []
              )

              possible = []

              for event in events:
                  if (
                      event.get('strSport')
                      != 'Soccer'
                  ):
                      continue

                  if (
                      event.get('dateEvent')
                      != day
                  ):
                      continue

                  if (
                      norm(event.get(
                          'strHomeTeam',
                          ''
                      ))
                      != norm(teams[0])
                  ):
                      continue

                  if (
                      norm(event.get(
                          'strAwayTeam',
                          ''
                      ))
                      != norm(teams[1])
                  ):
                      continue

                  status = str(
                      event.get('strStatus', '')
                  ).casefold()

                  if status not in (
                      'match finished',
                      'finished',
                      'ft',
                      'final',
                      'full time'
                  ):
                      continue

                  try:
                      h = int(
                          event['intHomeScore']
                      )

                      a = int(
                          event['intAwayScore']
                      )

                  except (
                      ValueError,
                      TypeError,
                      KeyError
                  ):
                      continue

                  possible.append((
                      h,
                      a,
                      event.get('idEvent')
                  ))

              if len(possible) != 1:
                  return None

              return possible[0]

          try:
              telegram(
                  'setMyCommands',
                  {
                      'commands': json.dumps(
                          [
                              {
                                  'command': c,
                                  'description': d
                              }
                              for c, d in [
                                  (
                                      'menu',
                                      'Меню з кнопками'
                                  ),
                                  (
                                      'stats',
                                      'Цей місяць'
                                  ),
                                  (
                                      'total',
                                      'Обидва разом'
                                  ),
                                  (
                                      'history',
                                      'Архів місяців'
                                  ),
                                  (
                                      'pending',
                                      'Очікують результат'
                                  ),
                                  (
                                      'alltime',
                                      'Весь час'
                                  )
                              ]
                          ],
                          ensure_ascii=False
                      )
                  }
              )

          except Exception as exc:
              print(
                  'Telegram menu warning:',
                  type(exc).__name__
              )

          process_commands()

          dt = now()

          if dt.day == 1:
              prev = shift(
                  month_start(dt),
                  -1
              )

              period = prev.strftime(
                  '%Y-%m'
              )

              if (
                  state.get('last_monthly_report')
                  != period
              ):
                  send(
                      report(
                          prev,
                          month_start(dt),
                          'ПІДСУМКИ ' + period
                      ),
                      MENU
                  )

                  state['last_monthly_report'] = period

                  save()

          all_tips = []
          errors = []

          with sync_playwright() as pw:
              browser = pw.chromium.launch(
                  headless=True
              )

              try:
                  for author, url in SOURCES.items():
                      body, html = load_page(
                          browser,
                          author,
                          url
                      )

                      if body is None:
                          errors.append(author)
                          continue

                      try:
                          if author == 'Geobetting':
                              tips = parse_geobetting(
                                  body
                              )
                          else:
                              tips = parse_tipstonga(
                                  body
                              )

                          add_odds(html, tips)

                          all_tips.extend(tips)

                          print(
                              'CHECKED',
                              author,
                              'tips',
                              len(tips)
                          )

                      except Exception as exc:
                          errors.append(author)

                          print(
                              'PARSER WARNING',
                              author,
                              str(exc)
                          )

              finally:
                  browser.close()

          grouped = {}

          for t in all_tips:
              grouped.setdefault(
                  t['match_key'],
                  []
              ).append(t)

          new = 0
          recovered = 0

          for t in all_tips:
              if t['id'] not in snaps:
                  snaps[t['id']] = {
                      'author': t['author'],
                      'fixture': (
                          t['home']
                          + ' v '
                          + t['away']
                      ),
                      'selection': t['selection'],
                      'market': t['market'],
                      'date': t['date'],
                      'odds_first_seen': t['odds'],
                      'first_seen_at': now().isoformat(
                          timespec='seconds'
                      ),
                      'source': t['url'],
                      'result': 'pending',
                      'recovered': t['id'] in seen
                  }

                  if t['id'] in seen:
                      recovered += 1

              if t['id'] in seen:
                  continue

              message = (
                  '⚽ НОВИЙ ПРОГНОЗ\n'
                  '━━━━━━━━━━━━━\n'
                  f'👤 {t["author"]}\n'
                  f'🏟 {t["home"]} — {t["away"]}\n'
                  f'📅 {t["date"]}\n'
                  f'📊 {MARKETS[t["market"]]}\n'
                  f'🎯 {t["selection"]}\n'
                  f'💰 OLBG: {t["odds"] or "н/д"}\n'
                  f'🕘 Виявлено: '
                  + now().strftime('%d.%m.%Y %H:%M')
                  + ' (Київ)\n'
              )

              if t['time']:
                  message += (
                      '🕒 Час OLBG: '
                      + t['time']
                      + '\n'
                  )

              other = [
                  x
                  for x in grouped.get(
                      t['match_key'],
                      []
                  )
                  if x['author'] != t['author']
              ]

              other += [
                  x
                  for x in matches.get(
                      t['match_key'],
                      []
                  )
                  if x.get(
                      'author',
                      x.get('tipster')
                  ) != t['author']
              ]

              if other:
                  message += (
                      '\n⚠️ ІНШИЙ КАППЕР '
                      'НА ЦЕЙ МАТЧ:\n'
                  )

                  for x in other:
                      message += (
                          '• '
                          + str(
                              x.get(
                                  'author',
                                  x.get('tipster')
                              )
                          )
                          + ': '
                          + x['selection']
                          + '\n'
                      )

              message += '\n🔗 ' + t['url']

              send(
                  message,
                  [
                      [
                          (
                              '📊 Статистика',
                              'stats'
                          ),
                          (
                              '🏠 Меню',
                              'menu'
                          )
                      ]
                  ]
              )

              seen.add(t['id'])

              previous = matches.setdefault(
                  t['match_key'],
                  []
              )

              if not any(
                  x.get(
                      'author',
                      x.get('tipster')
                  ) == t['author']
                  and x.get('market') == t['market']
                  and x.get('selection') == t['selection']
                  for x in previous
              ):
                  previous.append({
                      'author': t['author'],
                      'market': t['market'],
                      'selection': t['selection']
                  })

              save()
              new += 1

          checked_matches = {}
          settled_count = 0

          for key, item in snaps.items():
              if (
                  item.get('result', 'pending')
                  != 'pending'
              ):
                  continue

              day = item.get('date')

              if (
                  not day
                  or not re.fullmatch(
                      r'20\d{2}-\d{2}-\d{2}',
                      str(day)
                  )
              ):
                  continue

              try:
                  age = (
                      now().date()
                      - datetime.strptime(
                          day,
                          '%Y-%m-%d'
                      ).date()
                  ).days

              except ValueError:
                  continue

              if age < 1 or age > 21:
                  continue

              if item.get('market') not in (
                  'Result',
                  'Full Time Result',
                  'Both Teams to Score',
                  'Total Goals',
                  'Correct Score'
              ):
                  continue

              match_id = (
                  item.get('fixture'),
                  day
              )

              if match_id not in checked_matches:
                  try:
                      checked_matches[match_id] = (
                          fetch_result(item)
                      )

                  except Exception as exc:
                      checked_matches[match_id] = None

                      print(
                          'RESULT LOOKUP WARNING',
                          day,
                          type(exc).__name__
                      )

              match_result = checked_matches[
                  match_id
              ]

              if match_result is None:
                  continue

              home, away, event_id = match_result

              verdict = settled_from_score(
                  item,
                  home,
                  away
              )

              if verdict is None:
                  continue

              item['result'] = verdict

              item['settled_at'] = now().isoformat(
                  timespec='seconds'
              )

              item['final_score'] = (
                  f'{home}:{away}'
              )

              item['result_source'] = (
                  'TheSportsDB event '
                  + str(event_id)
              )

              settled_count += 1

              print(
                  'AUTO SETTLED',
                  item['author'],
                  item['fixture'],
                  verdict,
                  home,
                  away
              )

              save()

          if settled_count:
              start = month_start(now())

              send(
                  '✅ Автоматично розраховано '
                  'прогнозів: '
                  + str(settled_count)
                  + '\n\n'
                  + report(
                      start,
                      shift(start, 1),
                      now().strftime('%m.%Y')
                  ),
                  MENU
              )

          errors = sorted(set(errors))

          previous_errors = sorted(
              state.get(
                  'unavailable_sources',
                  []
              )
          )

          if errors != previous_errors:
              if errors:
                  send(
                      '⚠️ OLBG: не вдалося '
                      'підтвердити сторінку: '
                      + ', '.join(errors)
                      + '. Це не означає, що '
                      'прогнозів немає. '
                      'Перевірка повториться.',
                      BACK
                  )

              elif previous_errors:
                  send(
                      '✅ OLBG: перевірка всіх '
                      'капперів відновилася.',
                      BACK
                  )

              state['unavailable_sources'] = errors

          save()

          print(
              'SUMMARY new:',
              new,
              'recovered:',
              recovered,
              'settled:',
              settled_count,
              'unavailable:',
              ','.join(errors) or 'none'
          )

          print('Monitoring complete')
          PY
