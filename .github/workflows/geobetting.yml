
name: Football Tips Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: football-tips-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install chromium

      - name: Monitor both tipsters
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import unicodedata
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from playwright.sync_api import sync_playwright

          TIPSTERS = {"Geobetting": "420769", "tipstonga": "13000"}
          STATE = Path(".state/football-tips.json")
          MARKETS = {
              "Full Time Result": "Результат матчу",
              "Total Goals": "Тотал голів",
              "Both Teams to Score": "Обидві заб'ють",
              "Asian Hcap": "Азійська фора",
              "Result and BTTS": "Результат + обидві заб'ють",
              "Total Corners": "Тотал кутових",
              "Total Cards": "Тотал карток",
              "Correct Score": "Точний рахунок",
              "Half Time Result": "Результат першого тайму",
              "Half Time/Full Time": "Тайм / матч",
              "Anytime Goalscorer": "Автор гола",
              "First Goalscorer": "Перший автор гола",
          }
          MONTHS = {
              "January": "січня", "February": "лютого", "March": "березня",
              "April": "квітня", "May": "травня", "June": "червня",
              "July": "липня", "August": "серпня", "September": "вересня",
              "October": "жовтня", "November": "листопада", "December": "грудня",
          }
          # Only verified, explicit alias mappings. Avoid fuzzy guesses.
          ALIASES = {
              "man utd": "manchester united",
              "man united": "manchester united",
              "manchester utd": "manchester united",
              "man city": "manchester city",
              "manchester c": "manchester city",
              "spurs": "tottenham hotspur",
              "tottenham": "tottenham hotspur",
              "inter milan": "internazionale",
              "inter milano": "internazionale",
              "ac milan": "milan",
              "bayern": "bayern munich",
              "bayern munchen": "bayern munich",
              "psg": "paris saint germain",
              "paris sg": "paris saint germain",
              "paris saint-germain": "paris saint germain",
              "atletico de madrid": "atletico madrid",
              "ath madrid": "atletico madrid",
              "real madrid cf": "real madrid",
              "barca": "barcelona",
              "fc barcelona": "barcelona",
              "fc copenhagen": "kobenhavn",
              "fc kopenhagen": "kobenhavn",
              "fc kobenhavn": "kobenhavn",
              "copenhagen": "kobenhavn",
              "red star belgrade": "crvena zvezda",
              "red star": "crvena zvezda",
              "crvena zvezda belgrade": "crvena zvezda",
              "olympiakos": "olympiacos",
              "sporting cp": "sporting lisbon",
              "sporting clube de portugal": "sporting lisbon",
              "roma": "as roma",
              "as monaco": "monaco",
              "olympique marseille": "marseille",
              "marseille": "marseille",
              "leverkusen": "bayer leverkusen",
              "gladbach": "borussia monchengladbach",
              "borussia m gladbach": "borussia monchengladbach",
              "nottm forest": "nottingham forest",
              "wolves": "wolverhampton wanderers",
              "wolverhampton": "wolverhampton wanderers",
              "newcastle": "newcastle united",
              "west ham": "west ham united",
              "brighton": "brighton and hove albion",
          }
          FIXTURE_RE = re.compile(
              r"^(\d{1,2}:\d{2})\s+(.+?)\s+v\s+(.+)$", re.I
          )
          DATE_RE = re.compile(r"^\d{1,2} [A-Za-z]+ 20\d{2}$")

          def norm(team):
              team = unicodedata.normalize("NFKD", team.casefold())
              team = "".join(c for c in team if not unicodedata.combining(c))
              team = re.sub(r"[^a-z0-9]+", " ", team).strip()
              team = re.sub(r"\s+", " ", team)
              return ALIASES.get(team, team)

          def match_key(day, home, away):
              return day + "|" + "|".join(sorted((norm(home), norm(away))))

          def translate(selection, market):
              s = selection.strip()
              if market == "Full Time Result":
                  if s.lower() in ("draw", "x"):
                      return "Нічия"
                  return "Перемога: " + s
              if re.fullmatch(r"Yes\s*\(BTTS\)", s, re.I):
                  return "Обидві заб'ють — Так"
              if re.fullmatch(r"No\s*\(BTTS\)", s, re.I):
                  return "Обидві заб'ють — Ні"
              s = re.sub(r"^Over\s+", "Більше ", s, flags=re.I)
              s = re.sub(r"^Under\s+", "Менше ", s, flags=re.I)
              s = s.replace("(AH)", "(азійська фора)")
              return re.sub(r"(?<=\d)\.(?=\d)", ",", s)

          def date_uk(day):
              date = datetime.strptime(day, "%Y-%m-%d")
              return f"{date.day} {MONTHS[date.strftime('%B')]} {date.year}"

          def telegram(message):
              if not os.getenv("BOT_TOKEN") or not os.getenv("CHAT_ID"):
                  raise RuntimeError("Missing Telegram repository secrets")
              url = "https://api.telegram.org/bot" + os.environ["BOT_TOKEN"] + "/sendMessage"
              data = urllib.parse.urlencode({
                  "chat_id": os.environ["CHAT_ID"],
                  "text": message,
                  "disable_notification": "false",
                  "disable_web_page_preview": "true",
              }).encode()
              with urllib.request.urlopen(url, data=data, timeout=30) as response:
                  result = json.load(response)
              if not result.get("ok"):
                  raise RuntimeError("Telegram did not accept message")

          def read_tips(browser, name, user_id):
              url = "https://www.olbg.com/tipsters/tips/" + user_id
              page = browser.new_page(viewport={"width": 390, "height": 844})
              try:
                  page.goto(url, wait_until="domcontentloaded", timeout=60000)
                  try:
                      page.get_by_text("Accept all", exact=True).last.click(timeout=2500)
                  except Exception:
                      pass
                  page.wait_for_timeout(4000)
                  body = page.locator("body").inner_text()
              finally:
                  page.close()
              title = name.lower() + "'s tips"
              if title not in body.lower():
                  raise RuntimeError("Current Tips heading missing for " + name)
              if name.lower() + " has no current tips." in body.lower():
                  print(name, ": no active tips")
                  return []
              lines = [x.strip() for x in body.splitlines() if x.strip()]
              start = next(i for i, x in enumerate(lines) if title in x.lower())
              lines = lines[start + 1:]
              for i, item in enumerate(lines):
                  if item.startswith("Tips are normally settled"):
                      lines = lines[:i]
                      break

              # Parse sequentially: each market belongs to the nearest preceding fixture.
              current_day = None
              home = away = clock = None
              results = []
              for i, item in enumerate(lines):
                  if DATE_RE.fullmatch(item):
                      current_day = datetime.strptime(item, "%d %B %Y").date().isoformat()
                      home = away = clock = None
                      continue
                  fm = FIXTURE_RE.fullmatch(item)
                  if fm:
                      clock, home, away = fm.groups()
                      continue
                  if item not in MARKETS or not home or not current_day or i == 0:
                      continue
                  selection = lines[i - 1]
                  if (not selection or selection in MARKETS or selection in ("@", "WIN", "50 WIN")
                          or len(selection) > 120 or FIXTURE_RE.fullmatch(selection)):
                      continue
                  identity = match_key(current_day, home, away)
                  raw = "|".join((name, identity, item, selection))
                  key = hashlib.sha256(raw.encode("utf-8")).hexdigest()
                  results.append({
                      "id": key, "tipster": name, "date": current_day,
                      "clock": clock, "home": home, "away": away,
                      "market": item, "selection": selection,
                      "match_key": identity, "url": url,
                  })
              unique = {tip["id"]: tip for tip in results}
              print(name, ": recognized", len(unique), "tips")
              if not unique:
                  raise RuntimeError("Active tips present but not parsed for " + name)
              return list(unique.values())

          def save_state(state):
              STATE.parent.mkdir(parents=True, exist_ok=True)
              STATE.write_text(json.dumps(state, ensure_ascii=False, indent=2), encoding="utf-8")
              subprocess.run(["git", "add", str(STATE)], check=True)
              changes = subprocess.run(["git", "diff", "--cached", "--quiet"])
              if changes.returncode == 0:
                  return
              subprocess.run([
                  "git", "-c", "user.name=github-actions[bot]",
                  "-c", "user.email=41898282+github-actions[bot]@users.noreply.github.com",
                  "commit", "-m", "Save football alerts state",
              ], check=True)
              subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)

          if STATE.exists():
              state = json.loads(STATE.read_text(encoding="utf-8"))
          else:
              state = {"seen": [], "matches": {}}
          seen = set(state.get("seen", []))
          matches = state.get("matches", {})

          collected, errors = [], []
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              try:
                  for name, uid in TIPSTERS.items():
                      try:
                          collected.extend(read_tips(browser, name, uid))
                      except Exception as error:
                          errors.append(name)
                          print("ERROR:", name, str(error))
              finally:
                  browser.close()

          # Never erase history when there are zero active tips.
          pending = [t for t in collected if t["id"] not in seen]
          print("New tips:", len(pending))

          for tip in pending:
              previous = matches.get(tip["match_key"], [])
              other = [p for p in previous if p["tipster"] != tip["tipster"]]
              fixture = tip["home"] + " — " + tip["away"]
              message = (
                  "⚽ НОВИЙ ПРОГНОЗ\n\n"
                  f"👤 Каппер: {tip['tipster']}\n"
                  f"🏟 Матч: {fixture}\n"
                  f"📅 Дата: {date_uk(tip['date'])}"
                  + (f" · {tip['clock']} (час OLBG)" if tip["clock"] else "")
                  + "\n"
                  + f"📊 Ринок: {MARKETS[tip['market']]}\n"
                  + f"🎯 Ставка: {translate(tip['selection'], tip['market'])}\n"
                  + "📌 Коефіцієнт перевір у букмекера\n"
              )
              if other:
                  message += "\n⚠️ ЗБІГ: інший каппер обрав той самий матч!\n"
                  for p in other:
                      message += (
                          f"• {p['tipster']}: "
                          f"{translate(p['selection'], p['market'])}\n"
                      )
                  message += "Врахуй сумарний ризик ставок.\n"
              message += "\n🔗 " + tip["url"]
              telegram(message)
              seen.add(tip["id"])
              matches.setdefault(tip["match_key"], []).append({
                  "tipster": tip["tipster"],
                  "market": tip["market"],
                  "selection": tip["selection"],
              })
              state = {"seen": sorted(seen), "matches": matches}
              save_state(state)
              print("Sent:", tip["tipster"], fixture)

          if errors:
              raise RuntimeError("Could not check: " + ", ".join(errors))
          print("Monitoring complete")
          PY
