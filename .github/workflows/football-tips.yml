
name: Football Tips Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: football-tips-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser
        run: |
          pip install beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Check OLBG and Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

        run: |
          python3 -u - <<'PY'
          import hashlib, json, os, re, subprocess, unicodedata
          import urllib.parse, urllib.request
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          KYIV = ZoneInfo('Europe/Kyiv')
          LONDON = ZoneInfo('Europe/London')
          STATE = Path('.state/football-tips.json')

          # Add future cappers here.
          CAPPERS = {
              'Geobetting': '420769',
              'tipstonga': '13000'
          }

          EXTRA_PROFILES = {
              'tipstonga': [
                  'https://www.olbg.com/best-tipsters/Football/1/13000'
              ]
          }

          BASE = 'https://www.olbg.com'

          MARKETS = {
              'Result': 'Результат матчу',
              'Full Time Result': 'Результат матчу',
              'Both Teams to Score': 'Обидві заб’ють',
              'Total Goals': 'Тотал голів',
              'Asian Hcap': 'Азійська фора',
              'Correct Score': 'Точний рахунок',
              'Result and BTTS': 'Результат + ОЗ',
              'Total Corners': 'Кутові',
              'Total Cards': 'Картки',
              'Half Time Result': 'Перший тайм',
              'Half Time/Full Time': 'Тайм / матч',
              'Anytime Goalscorer': 'Автор гола',
              'First Goalscorer': 'Перший гол'
          }

          FIXTURE = re.compile(
              r'^(?:(\d{1,2}:\d{2})\s+)?(.+?)\s+v\s+(.+)$',
              re.I
          )
          DATE = re.compile(r'^\d{1,2} [A-Za-z]+ 20\d{2}$')
          RESULTS = ('win', 'loss', 'push', 'half_win', 'half_loss')

          TOKEN = os.environ['BOT_TOKEN'].strip()
          CHAT = os.environ['CHAT_ID'].strip()

          if STATE.exists():
              state = json.loads(STATE.read_text(encoding='utf-8'))
          else:
              state = {}

          seen = set(state.get('seen', []))
          snapshots = state.setdefault('snapshots', {})
          matches = state.setdefault('matches', {})
          state.setdefault('source_status', {})

          def now():
              return datetime.now(KYIV)

          def current_url(name):
              return f'{BASE}/tipsters/tips/{CAPPERS[name]}'

          def history_url(name):
              return f'{BASE}/tipsters/tips/history/{CAPPERS[name]}'

          def http_json(url, payload=None):
              data = (
                  urllib.parse.urlencode(payload).encode()
                  if payload is not None else None
              )
              req = urllib.request.Request(
                  url,
                  data=data,
                  headers={
                      'User-Agent': 'Mozilla/5.0',
                      'Accept': 'application/json'
                  }
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          def api(method, args=None):
              url = f'https://api.telegram.org/bot{TOKEN}/{method}'
              result = http_json(url, args or {})
              if not result.get('ok'):
                  raise RuntimeError(f'Telegram {method}: {result}')
              return result['result']

          MENU = [
              [('📊 Цей місяць', 'stats'), ('🏆 Разом', 'total')],
              [('📈 30 днів', 'compare'), ('📚 Архів', 'archive')],
              [('📅 3 місяці', 'last3'), ('📅 6 місяців', 'last6')],
              [('📅 12 місяців', 'last12'), ('♾ Весь час', 'alltime')],
              [('⏳ Очікують', 'pending'), ('🔎 Джерела', 'sources')],
              [('❔ Допомога', 'help')]
          ]

          BACK = [[('⬅️ Меню', 'menu')]]

          def send(text, buttons=None, edit=None):
              args = {
                  'chat_id': CHAT,
                  'text': text[:4096],
                  'disable_web_page_preview': 'true'
              }

              if buttons is not None:
                  args['reply_markup'] = json.dumps({
                      'inline_keyboard': [
                          [
                              {
                                  'text': label,
                                  'callback_data': key
                              }
                              for label, key in row
                          ]
                          for row in buttons
                      ]
                  }, ensure_ascii=False)

              if edit is not None:
                  args['message_id'] = edit
                  return api('editMessageText', args)

              return api('sendMessage', args)

          def save():
              state['seen'] = sorted(seen)
              STATE.parent.mkdir(parents=True, exist_ok=True)

              STATE.write_text(
                  json.dumps(state, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8'
              )

              subprocess.run(
                  ['git', 'add', str(STATE)],
                  check=True
              )

              rc = subprocess.run(
                  ['git', 'diff', '--cached', '--quiet']
              ).returncode

              if rc == 0:
                  return
              if rc != 1:
                  raise RuntimeError('git diff failed')

              subprocess.run([
                  'git',
                  '-c', 'user.name=github-actions[bot]',
                  '-c',
                  'user.email=41898282+github-actions[bot]@users.noreply.github.com',
                  'commit',
                  '-m', 'Save tip archive'
              ], check=True)

              subprocess.run(
                  ['git', 'push', 'origin', 'HEAD:main'],
                  check=True
              )

          ALIASES = {
              'barca': 'barcelona',
              'roma': 'as roma',
              'man utd': 'manchester united',
              'man city': 'manchester city',
              'psg': 'paris saint germain',
              'spurs': 'tottenham hotspur',
              'como 1907': 'como'
          }

          def norm(value):
              s = ''.join(
                  c for c in unicodedata.normalize(
                      'NFKD', str(value).casefold()
                  )
                  if not unicodedata.combining(c)
              )
              s = re.sub(r'[^a-z0-9]+', ' ', s).strip()
              return ALIASES.get(s, s)

          def make_tip(author, day, clock, home, away,
                       market, selection):
              key = day + '|' + '|'.join(
                  sorted((norm(home), norm(away)))
              )
              raw = '|'.join((
                  author,
                  key,
                  market,
                  selection.casefold().strip()
              ))
              uid = hashlib.sha256(raw.encode()).hexdigest()

              return dict(
                  id=uid,
                  author=author,
                  date=day,
                  time=clock,
                  home=home,
                  away=away,
                  market=market,
                  selection=selection,
                  match_key=key,
                  odds=None,
                  url=current_url(author)
              )

          def decode_date(line):
              if DATE.fullmatch(line):
                  try:
                      return datetime.strptime(
                          line, '%d %B %Y'
                      ).date().isoformat()
                  except ValueError:
                      pass
              return None

          def parse_current(author, body):
              lines = [
                  x.strip() for x in body.splitlines()
                  if x.strip()
              ]
              title = f"{author.casefold()}'s tips"

              heading = next(
                  (
                      i for i, x in enumerate(lines)
                      if title in x.casefold()
                      and 'history' not in x.casefold()
                  ),
                  None
              )

              if heading is None:
                  raise ValueError('Current Tips header missing')

              region = lines[heading + 1:]

              end = next(
                  (
                      i for i, x in enumerate(region)
                      if 'tips are normally settled' in x.casefold()
                  ),
                  len(region)
              )
              region = region[:end]

              empty_message = (
                  f'{author.casefold()} has no current tips'
              )
              if any(
                  empty_message in x.casefold()
                  for x in region
              ):
                  return [], 'empty'

              found = []
              day = clock = home = away = None

              for i, line in enumerate(region):
                  possible = decode_date(line)

                  if possible:
                      day = possible
                      clock = home = away = None
                      continue

                  m = FIXTURE.fullmatch(line)

                  if day and m:
                      clock, home, away = m.groups()
                      continue

                  if line in MARKETS and day and home and i:
                      choice = region[i - 1]

                      if (
                          choice not in MARKETS
                          and not FIXTURE.fullmatch(choice)
                          and len(choice) < 100
                      ):
                          found.append(
                              make_tip(
                                  author, day, clock,
                                  home, away, line, choice
                              )
                          )

              if not found:
                  raise ValueError(
                      'Current page present but tips unparseable'
                  )

              unique = {
                  t['id']: t for t in found
              }
              return list(unique.values()), 'tips'

          def fetch(browser, url):
              # First attempt: public HTML.
              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          'User-Agent': 'Mozilla/5.0',
                          'Accept-Language': 'en-GB,en;q=0.9'
                      }
                  )
                  with urllib.request.urlopen(
                      req, timeout=15
                  ) as response:
                      html = response.read(
                          2_000_000
                      ).decode('utf-8', 'replace')

                  soup = BeautifulSoup(html, 'html.parser')

                  for n in soup([
                      'script', 'style', 'noscript'
                  ]):
                      n.decompose()

                  body = soup.get_text('\n', strip=True)

                  if "'s Tips" in body or "'s tips" in body:
                      return body, html, 'HTTP'

              except Exception as e:
                  print(
                      'HTTP FAILED',
                      url,
                      type(e).__name__,
                      str(e)[:80]
                  )

              # Second attempt: rendered Chromium page.
              page = browser.new_page(
                  locale='en-GB',
                  viewport={'width': 1366, 'height': 900}
              )

              try:
                  resp = page.goto(
                      url,
                      wait_until='domcontentloaded',
                      timeout=30000
                  )

                  if resp and resp.status >= 400:
                      raise ValueError(
                          f'HTTP {resp.status}'
                      )

                  try:
                      page.get_by_text(
                          'Accept all', exact=True
                      ).first.click(timeout=700)
                  except Exception:
                      pass

                  page.wait_for_timeout(2500)

                  return (
                      page.locator('body').inner_text(),
                      page.content(),
                      'browser'
                  )
              finally:
                  page.close()

          def inspect_capper(browser, author):
              urls = [
                  current_url(author),
                  history_url(author)
              ] + EXTRA_PROFILES.get(author, [])

              diagnostics = []
              tips = None
              checked_via = None

              for pos, url in enumerate(urls):
                  try:
                      body, html, method = fetch(
                          browser, url
                      )

                      if pos == 0:
                          parsed, kind = parse_current(
                              author, body
                          )
                          tips = parsed
                          checked_via = method
                          diagnostics.append(
                              f'current:{kind}({len(parsed)})'
                          )

                      elif pos == 1:
                          ok = (
                              f"{author.casefold()}'s tips history"
                              in body.casefold()
                          )
                          diagnostics.append(
                              'history:' +
                              ('ok' if ok else 'unconfirmed')
                          )

                      else:
                          ok = (
                              author.casefold()
                              in body.casefold()
                          )
                          diagnostics.append(
                              'profile:' +
                              ('ok' if ok else 'unconfirmed')
                          )

                      print(
                          'SOURCE',
                          author,
                          method,
                          url,
                          diagnostics[-1],
                          len(body)
                      )

                  except Exception as exc:
                      diagnostics.append(
                          ('current' if pos == 0 else 'other')
                          + ':error'
                      )
                      print(
                          'SOURCE ERROR',
                          author,
                          url,
                          type(exc).__name__,
                          str(exc)[:140]
                      )

              if tips is None:
                  raise ValueError(
                      'Current Tips not verified; '
                      + ', '.join(diagnostics)
                  )

              return tips, checked_via, diagnostics

          def first_seen(v):
              try:
                  d = datetime.fromisoformat(
                      v['first_seen_at']
                  )
                  if d.tzinfo is None:
                      return d.replace(tzinfo=KYIV)
                  return d.astimezone(KYIV)
              except (ValueError, KeyError, TypeError):
                  return None

          def entries(start=None, end=None, author=None):
              return [
                  (k, v)
                  for k, v in snapshots.items()
                  if first_seen(v) is not None
                  and (
                      start is None
                      or first_seen(v) >= start
                  )
                  and (
                      end is None
                      or first_seen(v) < end
                  )
                  and (
                      author is None
                      or v.get('author') == author
                  )
              ]

          def month_start(dt):
              return datetime(
                  dt.year, dt.month, 1, tzinfo=KYIV
              )

          def shift(dt, n):
              i = dt.year * 12 + dt.month - 1 + n
              return datetime(
                  i // 12,
                  i % 12 + 1,
                  1,
                  tzinfo=KYIV
              )

          def summary(rows, label):
              items = [v for _, v in rows]
              counts = {
                  r: sum(
                      v.get('result') == r for v in items
                  )
                  for r in RESULTS
              }

              settled = [
                  v for v in items
                  if v.get('result') in RESULTS
              ]
              priced = [
                  v for v in settled
                  if v.get('odds_first_seen') is not None
              ]

              n = counts['win'] + counts['loss']
              hit = (
                  f'{100 * counts["win"] / n:.1f}%'
                  if n else 'н/д'
              )

              if priced:
                  profit = sum(
                      {
                          'win': float(
                              v['odds_first_seen']
                          ) - 1,
                          'loss': -1,
                          'push': 0,
                          'half_win': (
                              float(v['odds_first_seen']) - 1
                          ) / 2,
                          'half_loss': -0.5
                      }[v['result']]
                      for v in priced
                  )

                  perf = (
                      f'{profit:+.2f} од. | ROI '
                      f'{100 * profit / len(priced):+.1f}%'
                  )

                  if len(priced) < len(settled):
                      perf += ' (часткові дані)'
              else:
                  perf = 'н/д | ROI н/д'

              known = sum(
                  v.get('odds_first_seen') is not None
                  for v in items
              )

              return (
                  f'👤 {label}\n'
                  f'⚽ Прогнозів: {len(items)}\n'
                  f'✅ {counts["win"]}  '
                  f'❌ {counts["loss"]}  '
                  f'↩️ {counts["push"]}  '
                  f'⏳ {len(items) - len(settled)}\n'
                  f'◐ Піввиграші: {counts["half_win"]}  '
                  f'Півпрограші: {counts["half_loss"]}\n'
                  f'🎯 Прохідність: {hit}\n'
                  f'💰 Прибуток: {perf}\n'
                  f'🔎 Коефіцієнти: {known}/{len(items)}'
              )

          def report(start, end, title, combined=False):
              heading = (
                  f'📊 FOOTBALL TIPS — {title}\n'
                  '━━━━━━━━━━━━━\n\n'
              )

              if combined:
                  return heading + summary(
                      entries(start, end),
                      'Обидва разом'
                  )

              individual = '\n\n'.join(
                  summary(
                      entries(start, end, name),
                      name
                  )
                  for name in CAPPERS
              )

              return (
                  heading
                  + individual
                  + '\n\n'
                  + summary(
                      entries(start, end),
                      '🏆 УСІ РАЗОМ'
                  )
                  + '\n\nℹ️ Статистика лише з прогнозів, '
                    'які бот зберіг. ROI за 1 од.'
              )

          def view(key):
              dt = now()
              start = month_start(dt)

              if key in ('start', 'menu'):
                  return (
                      '⚽ FOOTBALL TIPS ALERTS\n\n'
                      'Обери розділ:',
                      MENU
                  )

              if key == 'stats':
                  return report(
                      start,
                      shift(start, 1),
                      dt.strftime('%m.%Y')
                  ), BACK

              if key == 'total':
                  return report(
                      start,
                      shift(start, 1),
                      dt.strftime('%m.%Y'),
                      True
                  ), BACK

              if key == 'compare':
                  return report(
                      dt - timedelta(days=30),
                      dt,
                      '30 ДНІВ'
                  ), BACK

              if key in ('last3', 'last6', 'last12'):
                  n = int(key[4:])
                  return report(
                      shift(start, 1 - n),
                      dt,
                      f'{n} МІСЯЦІВ'
                  ), BACK

              if key == 'alltime':
                  return report(
                      None, None, 'ЗА ВЕСЬ ЧАС'
                  ), BACK

              if key == 'help':
                  return (
                      '❔ Бот перевіряє Current Tips, '
                      'історію та профілі OLBG. '
                      'Історія не створює нових сповіщень. '
                      'Якщо джерело не підтверджене, '
                      'бот не вважає це нулем прогнозів.\n'
                      '/month 2026-10 — архів місяця.\n'
                      'Кнопки відповідають під час наступного '
                      'GitHub Actions запуску.'
                  ), BACK

              if key == 'sources':
                  chunks = ['🔎 СТАН ДЖЕРЕЛ']

                  for name in CAPPERS:
                      d = state.get(
                          'source_status', {}
                      ).get(name, {})

                      chunks.append(
                          f'\n{name}: '
                          f'{d.get("status", "не перевірено")}\n'
                          f'Час: {d.get("checked_at", "н/д")}\n'
                          f'Перевірки: '
                          f'{", ".join(d.get("checks", []))}'
                      )

                  return '\n'.join(chunks), BACK

              if key == 'pending':
                  rows = sorted(
                      [
                          v for _, v in entries()
                          if v.get('result') not in RESULTS
                      ],
                      key=lambda v: first_seen(v),
                      reverse=True
                  )

                  lines = [
                      f'⏳ ОЧІКУЮТЬ: {len(rows)}'
                  ]

                  for v in rows[:12]:
                      lines.append(
                          f'\n⚽ {v.get("fixture")}\n'
                          f'👤 {v.get("author")}\n'
                          f'🎯 {v.get("selection")}'
                      )

                  return '\n'.join(lines), BACK

              periods = sorted(
                  {
                      d.strftime('%Y-%m')
                      for v in snapshots.values()
                      if (d := first_seen(v))
                  },
                  reverse=True
              )

              if key in ('archive', 'history'):
                  text = (
                      '📚 АРХІВ\n'
                      + '\n'.join(periods[:24])
                      if periods
                      else '📚 Архів порожній.'
                  )
                  buttons = [
                      [('📅 ' + p, 'm:' + p)]
                      for p in periods[:24]
                  ] + BACK
                  return text, buttons

              if re.fullmatch(
                  r'm:20\d\d-(?:0[1-9]|1[0-2])',
                  key
              ):
                  y, m = map(int, key[2:].split('-'))
                  s = datetime(y, m, 1, tzinfo=KYIV)
                  return (
                      report(s, shift(s, 1), key[2:]),
                      [[('⬅️ Архів', 'archive')]]
                  )

              return 'Невідома команда. /menu', BACK

          def telegram_updates():
              updates = api(
                  'getUpdates',
                  {
                      'offset': int(
                          state.get('telegram_update_id', 0)
                      ),
                      'limit': 100,
                      'timeout': 0
                  }
              )

              for upd in updates:
                  callback = upd.get('callback_query')
                  msg = (
                      (callback.get('message') or {})
                      if callback
                      else (upd.get('message') or {})
                  )

                  try:
                      chat_id = str(
                          (msg.get('chat') or {}).get('id')
                      )
                      if chat_id != CHAT:
                          continue

                      if callback:
                          try:
                              api('answerCallbackQuery', {
                                  'callback_query_id': callback['id']
                              })
                          except Exception:
                              pass

                          out, buttons = view(
                              callback.get('data', 'menu')
                          )

                          try:
                              send(
                                  out, buttons,
                                  edit=msg['message_id']
                              )
                          except Exception:
                              send(out, buttons)

                      else:
                          command = (
                              msg.get('text') or ''
                          ).strip()

                          if not command.startswith('/'):
                              continue

                          words = command.split()
                          key = (
                              words[0]
                              .split('@')[0]
                              .lstrip('/')
                              .lower()
                          )

                          if (
                              key == 'month'
                              and len(words) == 2
                          ):
                              key = 'm:' + words[1]

                          out, buttons = view(key)
                          send(out, buttons)

                  except Exception as exc:
                      print(
                          'TELEGRAM UPDATE ERROR',
                          type(exc).__name__,
                          str(exc)[:150]
                      )
                  finally:
                      state['telegram_update_id'] = (
                          upd['update_id'] + 1
                      )

              if updates:
                  save()

              print('Telegram updates:', len(updates))

          def settle(item, h, a):
              market = item.get('market')
              choice = str(
                  item.get('selection', '')
              ).casefold().strip()

              teams = re.split(
                  r'\s+v\s+',
                  str(item.get('fixture', '')),
                  maxsplit=1,
                  flags=re.I
              )

              if (
                  market in ('Result', 'Full Time Result')
                  and len(teams) == 2
              ):
                  if choice in ('draw', 'tie', 'x'):
                      return (
                          'win' if h == a else 'loss'
                      )

                  if norm(choice) == norm(teams[0]):
                      return (
                          'win' if h > a else 'loss'
                      )

                  if norm(choice) == norm(teams[1]):
                      return (
                          'win' if a > h else 'loss'
                      )

              if market == 'Both Teams to Score':
                  yes = h > 0 and a > 0

                  if choice == 'yes':
                      return 'win' if yes else 'loss'

                  if choice == 'no':
                      return 'loss' if yes else 'win'

              if market == 'Correct Score':
                  m = re.fullmatch(
                      r'(\d+)\s*[-:]\s*(\d+)',
                      choice
                  )
                  if m:
                      expected = (
                          int(m[1]), int(m[2])
                      )
                      return (
                          'win'
                          if (h, a) == expected
                          else 'loss'
                      )

              if market == 'Total Goals':
                  m = re.fullmatch(
                      r'(over|under)\s+'
                      r'(\d+(?:[.,]\d+)?)'
                      r'\s*(?:goals)?',
                      choice
                  )

                  if not m:
                      return None

                  direction = m[1]
                  line = float(
                      m[2].replace(',', '.')
                  )
                  goals = h + a

                  def part(p):
                      if goals == p:
                          return 0
                      win = (
                          goals > p
                          if direction == 'over'
                          else goals < p
                      )
                      return 1 if win else -1

                  if int(round(line * 4)) % 2:
                      lower = int(line * 2) / 2
                      score = (
                          part(lower)
                          + part(lower + 0.5)
                      )
                      return {
                          2: 'win',
                          1: 'half_win',
                          0: 'push',
                          -1: 'half_loss',
                          -2: 'loss'
                      }[score]

                  return {
                      1: 'win',
                      0: 'push',
                      -1: 'loss'
                  }[part(line)]

              return None

          def lookup(item):
              names = re.split(
                  r'\s+v\s+',
                  str(item.get('fixture', '')),
                  maxsplit=1,
                  flags=re.I
              )

              if len(names) != 2:
                  return None

              date = item.get('date', '')
              query = urllib.parse.urlencode({
                  'e': names[0] + '_vs_' + names[1],
                  'd': date
              })

              url = (
                  'https://www.thesportsdb.com/'
                  'api/v1/json/123/searchevents.php?'
                  + query
              )
              data = http_json(url)

              events = (
                  data.get('event')
                  or data.get('events')
                  or []
              )

              good = []

              for e in events:
                  if (
                      e.get('strSport') != 'Soccer'
                      or e.get('dateEvent') != date
                  ):
                      continue

                  if (
                      norm(e.get('strHomeTeam'))
                      != norm(names[0])
                  ):
                      continue

                  if (
                      norm(e.get('strAwayTeam'))
                      != norm(names[1])
                  ):
                      continue

                  status = str(
                      e.get('strStatus') or ''
                  ).casefold().strip()

                  if status not in (
                      'match finished',
                      'finished',
                      'ft',
                      'final',
                      'full time'
                  ):
                      continue

                  try:
                      good.append((
                          int(e['intHomeScore']),
                          int(e['intAwayScore']),
                          e.get('idEvent')
                      ))
                  except (
                      ValueError,
                      TypeError,
                      KeyError
                  ):
                      continue

              return (
                  good[0] if len(good) == 1 else None
              )

          try:
              commands = [
                  ('menu', 'Головне меню'),
                  ('stats', 'Місяць'),
                  ('total', 'Разом'),
                  ('history', 'Архів'),
                  ('pending', 'Очікують'),
                  ('alltime', 'Весь час')
              ]

              api('setMyCommands', {
                  'commands': json.dumps(
                      [
                          {
                              'command': key,
                              'description': desc
                          }
                          for key, desc in commands
                      ],
                      ensure_ascii=False
                  )
              })
          except Exception as exc:
              print(
                  'MENU WARNING',
                  str(exc)[:100]
              )

          telegram_updates()

          tips = []
          failures = []

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              try:
                  for author in CAPPERS:
                      try:
                          current, method, checks = inspect_capper(
                              browser, author
                          )

                          tips.extend(current)

                          state['source_status'][author] = {
                              'status':
                                  f'✅ поточні: {len(current)} прогнозів',
                              'checked_at':
                                  now().strftime('%d.%m.%Y %H:%M'),
                              'method': method,
                              'checks': checks
                          }

                          print(
                              'CHECKED',
                              author,
                              'tips',
                              len(current),
                              'checks',
                              checks
                          )

                      except Exception as exc:
                          failures.append(author)

                          state['source_status'][author] = {
                              'status':
                                  '⚠️ не вдалося підтвердити '
                                  'поточні прогнози',
                              'checked_at':
                                  now().strftime('%d.%m.%Y %H:%M'),
                              'checks': [
                                  str(exc)[:130]
                              ]
                          }

                          print(
                              'UNVERIFIED',
                              author,
                              str(exc)[:160]
                          )

              finally:
                  browser.close()

          grouped = {}

          for t in tips:
              grouped.setdefault(
                  t['match_key'], []
              ).append(t)

          new = 0

          for t in tips:
              if t['id'] not in snapshots:
                  snapshots[t['id']] = {
                      'author': t['author'],
                      'fixture':
                          t['home'] + ' v ' + t['away'],
                      'date': t['date'],
                      'selection': t['selection'],
                      'market': t['market'],
                      'odds_first_seen': t['odds'],
                      'first_seen_at':
                          now().isoformat(
                              timespec='seconds'
                          ),
                      'source': t['url'],
                      'result': 'pending',
                      'recovered': t['id'] in seen
                  }

              if t['id'] in seen:
                  continue

              msg = (
                  '⚽ НОВИЙ ПРОГНОЗ\n'
                  '━━━━━━━━━━━━━\n'
                  f'👤 {t["author"]}\n'
                  f'🏟 {t["home"]} — {t["away"]}\n'
                  f'📅 {t["date"]}\n'
                  f'📊 {MARKETS[t["market"]]}\n'
                  f'🎯 {t["selection"]}\n'
                  f'💰 Коеф.: {t["odds"] or "н/д"}\n'
                  f'🕘 Виявлено: '
                  f'{now():%d.%m.%Y %H:%M} (Київ)\n'
              )

              if t['time']:
                  msg += (
                      '🕒 Час OLBG: '
                      + t['time']
                      + '\n'
                  )

              other = [
                  x
                  for x in grouped.get(
                      t['match_key'], []
                  )
                  if x['author'] != t['author']
              ]

              other += [
                  x
                  for x in matches.get(
                      t['match_key'], []
                  )
                  if x.get(
                      'author', x.get('tipster')
                  ) != t['author']
              ]

              if other:
                  msg += (
                      '\n⚠️ ІНШИЙ КАППЕР '
                      'НА ЦЕЙ МАТЧ:\n'
                  )

                  for x in other[:5]:
                      msg += (
                          '• '
                          + str(
                              x.get(
                                  'author',
                                  x.get('tipster')
                              )
                          )
                          + ': '
                          + x['selection']
                          + '\n'
                      )

              send(
                  msg + '\n🔗 ' + t['url'],
                  [[
                      ('📊 Статистика', 'stats'),
                      ('🏠 Меню', 'menu')
                  ]]
              )

              seen.add(t['id'])

              prior = matches.setdefault(
                  t['match_key'], []
              )

              exists = any(
                  x.get(
                      'author', x.get('tipster')
                  ) == t['author']
                  and x.get('market') == t['market']
                  and x.get('selection') == t['selection']
                  for x in prior
              )

              if not exists:
                  prior.append({
                      'author': t['author'],
                      'market': t['market'],
                      'selection': t['selection']
                  })

              save()
              new += 1

          completed = 0
          cache = {}

          for item in snapshots.values():
              if item.get(
                  'result', 'pending'
              ) != 'pending':
                  continue

              if item.get('market') not in (
                  'Result',
                  'Full Time Result',
                  'Both Teams to Score',
                  'Total Goals',
                  'Correct Score'
              ):
                  continue

              try:
                  age = (
                      now().date()
                      - datetime.strptime(
                          item['date'], '%Y-%m-%d'
                      ).date()
                  ).days
              except (
                  KeyError,
                  TypeError,
                  ValueError
              ):
                  continue

              if not 1 <= age <= 21:
                  continue

              ident = (
                  item.get('fixture'),
                  item.get('date')
              )

              if ident not in cache:
                  try:
                      cache[ident] = lookup(item)
                  except Exception as exc:
                      cache[ident] = None
                      print(
                          'RESULT WARNING',
                          str(exc)[:120]
                      )

              if cache[ident] is None:
                  continue

              h, a, event_id = cache[ident]
              result = settle(item, h, a)

              if result is None:
                  continue

              item.update(
                  result=result,
                  settled_at=now().isoformat(
                      timespec='seconds'
                  ),
                  final_score=f'{h}:{a}',
                  result_source=(
                      'TheSportsDB ' + str(event_id)
                  )
              )

              completed += 1

          if completed:
              save()

              send(
                  f'✅ Автоматично розраховано: '
                  f'{completed} прогнозів.\n\n'
                  + report(
                      month_start(now()),
                      shift(month_start(now()), 1),
                      now().strftime('%m.%Y')
                  ),
                  MENU
              )

          failures = sorted(set(failures))
          previous = sorted(
              state.get('unavailable_sources', [])
          )

          if failures != previous:
              if failures:
                  send(
                      '⚠️ Не підтверджені дані: '
                      + ', '.join(failures)
                      + '. Це НЕ означає, '
                        'що прогнозів немає.',
                      BACK
                  )
              elif previous:
                  send(
                      '✅ Доступ до поточних прогнозів '
                      'OLBG відновлено.',
                      BACK
                  )

          state['unavailable_sources'] = failures

          dt = now()

          if dt.day == 1:
              prior = shift(month_start(dt), -1)
              period = prior.strftime('%Y-%m')

              if state.get(
                  'last_monthly_report'
              ) != period:
                  send(
                      report(
                          prior,
                          month_start(dt),
                          'ПІДСУМКИ ' + period
                      ),
                      MENU
                  )
                  state['last_monthly_report'] = period

          save()

          print(
              'SUMMARY new:', new,
              'settled:', completed,
              'unverified:', failures
          )
          print('Monitoring complete')
          PY
