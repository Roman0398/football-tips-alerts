
name: Football Tips Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: football-tips-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser
        run: |
          pip install beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Monitor OLBG silently
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python3 -u - <<'PY'
          import os
          import re
          import json
          import hashlib
          import subprocess
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          TZ = ZoneInfo("Europe/Kyiv")
          BASE = "https://www.olbg.com"
          STATE = Path(".state/football-tips.json")

          CAPPERS = {
              "Geobetting": "420769",
              "tipstonga": "13000",
          }

          MARKETS = {
              "Result": "Результат",
              "Full Time Result": "Результат",
              "Both Teams to Score": "Обидві заб'ють",
              "Total Goals": "Тотал голів",
              "Correct Score": "Точний рахунок",
              "Asian Hcap": "Азійська фора",
              "Result and BTTS": "Результат + ОЗ",
              "Total Corners": "Кутові",
              "Total Cards": "Картки",
              "Half Time Result": "Перший тайм",
              "Half Time/Full Time": "Тайм / матч",
              "Anytime Goalscorer": "Автор гола",
              "First Goalscorer": "Перший гол",
          }

          TOKEN = os.environ["BOT_TOKEN"].strip()
          CHAT = os.environ["CHAT_ID"].strip()

          if STATE.exists():
              state = json.loads(STATE.read_text("utf-8"))
          else:
              state = {}

          seen = set(state.get("seen", []))
          snapshots = state.setdefault("snapshots", {})
          matches = state.setdefault("matches", {})
          sources = state.setdefault("source_status", {})

          def now():
              return datetime.now(TZ)

          def source_url(author):
              return BASE + "/tipsters/tips/" + CAPPERS[author]

          def telegram(message):
              data = urllib.parse.urlencode({
                  "chat_id": CHAT,
                  "text": message[:4096],
                  "disable_web_page_preview": "true",
              }).encode("utf-8")

              req = urllib.request.Request(
                  "https://api.telegram.org/bot"
                  + TOKEN + "/sendMessage",
                  data=data,
              )

              with urllib.request.urlopen(req, timeout=20) as r:
                  result = json.load(r)

              if not result.get("ok"):
                  raise RuntimeError("Telegram rejected message")

          def normalized(value):
              return re.sub(
                  r"\s+", " ", str(value).casefold().strip()
              )

          def tip_id(author, date, fixture, market, selection):
              raw = "|".join([
                  author,
                  date,
                  normalized(fixture),
                  market,
                  normalized(selection),
              ])
              return hashlib.sha256(raw.encode()).hexdigest()

          def extract(browser, author):
              address = source_url(author)
              page = browser.new_page(locale="en-GB")

              try:
                  response = page.goto(
                      address,
                      wait_until="domcontentloaded",
                      timeout=30000,
                  )

                  if response and response.status >= 400:
                      raise ValueError(
                          "HTTP " + str(response.status)
                      )

                  page.wait_for_timeout(2000)
                  text = page.locator("body").inner_text()

              finally:
                  page.close()

              lines = [
                  s.strip()
                  for s in text.splitlines()
                  if s.strip()
              ]

              heading = next(
                  (
                      i for i, s in enumerate(lines)
                      if author.casefold() + "'s tips"
                      in s.casefold()
                      and "history" not in s.casefold()
                  ),
                  None,
              )

              if heading is None:
                  raise ValueError("Current Tips heading missing")

              lines = lines[heading + 1:]

              stop = next(
                  (
                      i for i, s in enumerate(lines)
                      if "tips are normally settled"
                      in s.casefold()
                  ),
                  len(lines),
              )

              lines = lines[:stop]

              empty_text = (
                  author.casefold() + " has no current tips"
              )

              if any(
                  empty_text in s.casefold()
                  for s in lines
              ):
                  return []

              result = []
              date = None
              fixture = None
              clock = None

              date_pattern = re.compile(
                  r"\d{1,2} [A-Za-z]+ 20\d{2}"
              )

              fixture_pattern = re.compile(
                  r"(?:(\d{1,2}:\d{2})\s+)?"
                  r"(.+?)\s+v\s+(.+)",
                  re.I,
              )

              for i, line in enumerate(lines):
                  if date_pattern.fullmatch(line):
                      try:
                          date = datetime.strptime(
                              line, "%d %B %Y"
                          ).date().isoformat()
                      except ValueError:
                          date = None

                      fixture = None
                      clock = None
                      continue

                  found = fixture_pattern.fullmatch(line)

                  if found and date:
                      clock, home, away = found.groups()
                      fixture = home + " v " + away
                      continue

                  if (
                      line in MARKETS
                      and date
                      and fixture
                      and i > 0
                  ):
                      selection = lines[i - 1]

                      if (
                          selection in MARKETS
                          or len(selection) > 100
                          or fixture_pattern.fullmatch(selection)
                      ):
                          continue

                      identifier = tip_id(
                          author,
                          date,
                          fixture,
                          line,
                          selection,
                      )

                      result.append({
                          "id": identifier,
                          "author": author,
                          "date": date,
                          "time": clock,
                          "fixture": fixture,
                          "market": line,
                          "selection": selection,
                          "url": address,
                      })

              if not result:
                  raise ValueError(
                      "Page loaded but tips not verified"
                  )

              return list({
                  item["id"]: item
                  for item in result
              }.values())

          def save_state():
              state["seen"] = sorted(seen)
              STATE.parent.mkdir(
                  parents=True, exist_ok=True
              )
              STATE.write_text(
                  json.dumps(
                      state,
                      ensure_ascii=False,
                      indent=2,
                  ) + "\n",
                  encoding="utf-8",
              )

          def commit_state():
              subprocess.run(
                  ["git", "add", str(STATE)],
                  check=True,
              )

              check = subprocess.run([
                  "git", "diff", "--cached", "--quiet"
              ])

              if check.returncode == 0:
                  return

              subprocess.run([
                  "git",
                  "-c", "user.name=github-actions[bot]",
                  "-c",
                  "user.email=41898282+github-actions[bot]@users.noreply.github.com",
                  "commit",
                  "-m", "Update OLBG monitor state",
              ], check=True)

              subprocess.run([
                  "git", "push", "origin", "HEAD:main"
              ], check=True)

          new_count = 0
          current_tips = []

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(
                  headless=True
              )

              try:
                  for author in CAPPERS:
                      try:
                          tips = extract(browser, author)
                          current_tips.extend(tips)

                          sources[author] = {
                              "status": (
                                  f"✅ {len(tips)} поточних"
                              ),
                              "checked_at": now().strftime(
                                  "%d.%m.%Y %H:%M"
                              ),
                              "details": "Current Tips checked",
                          }

                          print(
                              "CHECKED", author,
                              len(tips), "tips"
                          )

                      except Exception as error:
                          sources[author] = {
                              "status": "⚠️ Не підтверджено",
                              "checked_at": now().strftime(
                                  "%d.%m.%Y %H:%M"
                              ),
                              "details": str(error)[:220],
                          }

                          # No Telegram alert here.
                          print(
                              "SOURCE UNVERIFIED",
                              author,
                              str(error)[:220],
                          )

              finally:
                  browser.close()

          # Preserve the current state and history.
          for tip in current_tips:
              identifier = tip["id"]

              if identifier in seen:
                  continue

              author = tip["author"]

              message = (
                  "⚽ НОВИЙ ФУТБОЛЬНИЙ ПРОГНОЗ\n\n"
                  f"👤 Капер: {author}\n"
                  f"🏟 Матч: {tip['fixture']}\n"
                  f"📅 Дата: {tip['date']}\n"
                  f"🕒 Час: {tip['time'] or 'н/д'}\n"
                  f"📊 Ринок: "
                  f"{MARKETS[tip['market']]}\n"
                  f"🎯 Прогноз: {tip['selection']}\n"
                  "💰 Коефіцієнт OLBG: н/д\n\n"
                  f"🔗 {tip['url']}"
              )

              # Only verified new tips trigger messages.
              telegram(message)

              match_key = (
                  tip["date"] + "|"
                  + normalized(tip["fixture"])
              )

              snapshots[identifier] = {
                  "author": author,
                  "fixture": tip["fixture"],
                  "date": tip["date"],
                  "selection": tip["selection"],
                  "market": tip["market"],
                  "odds_first_seen": None,
                  "first_seen_at": now().isoformat(
                      timespec="seconds"
                  ),
                  "source": tip["url"],
                  "result": "pending",
              }

              old = matches.setdefault(
                  match_key, []
              )

              if not any(
                  x.get("author", x.get("tipster"))
                  == author
                  and x.get("selection")
                  == tip["selection"]
                  for x in old
              ):
                  old.append({
                      "author": author,
                      "selection": tip["selection"],
                      "market": tip["market"],
                  })

              seen.add(identifier)
              save_state()
              commit_state()
              new_count += 1

          save_state()
          commit_state()

          # SILENT MODE:
          # No "no tips" messages.
          # No source failure alerts.
          # No recovery alerts.
          # No scheduled summaries.
          # Only new verified football tips.

          print(
              "DONE",
              "new:", new_count,
              "sources:", list(CAPPERS),
          )
          PY
